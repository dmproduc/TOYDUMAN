<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Үстелге арналған QR карточка — ToyDuman</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Onest', sans-serif; }
    
    body {
      background-color: #f5f4f0;
      color: #121212;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 16px;
    }

    .no-print-bar {
      margin-bottom: 24px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .btn-print {
      background: #121212;
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 30px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      transition: transform 0.15s;
    }
    .btn-print:active { transform: scale(0.96); }
    .btn-back {
      background: rgba(0, 0, 0, 0.06);
      color: #121212;
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 30px;
      font-size: 0.88rem;
      font-weight: 600;
    }

    /* А5 өлшемді премиум карточка (148 x 210 мм) */
    .card-print {
      width: 148mm;
      min-height: 210mm;
      background: #ffffff;
      padding: 18mm 14mm;
      border-radius: 6px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.06);
      border: 1px solid #eae8e4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      position: relative;
    }

    .border-inner {
      position: absolute;
      inset: 7mm;
      border: 1px solid #dcd7cc;
      border-radius: 4px;
      pointer-events: none;
    }

    .card-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 2;
    }
    .event-couple-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2.3rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1.15;
      margin-bottom: 2px;
    }
    .event-date-str {
      font-size: 0.85rem;
      color: #737373;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .instruction-lead {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.45rem;
      font-weight: 600;
      color: #222;
      margin-top: 14px;
      line-height: 1.25;
    }

    /* QR блогы */
    .qr-holder {
      background: #ffffff;
      padding: 14px;
      border: 1px solid #e5e2da;
      border-radius: 18px;
      margin: 14px 0;
      box-shadow: 0 4px 16px rgba(0,0,0,0.03);
      z-index: 2;
    }

    .card-bottom {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 2;
    }
    .guide-step {
      font-size: 0.82rem;
      color: #555;
      line-height: 1.45;
      max-width: 310px;
    }
    .brand-mark {
      font-size: 0.7rem;
      color: #999;
      letter-spacing: 0.5px;
      margin-top: 8px;
    }

    /* Баспаға шығарғанда */
    @media print {
      body { background: #fff; padding: 0; min-height: auto; }
      .no-print-bar { display: none !important; }
      .card-print {
        box-shadow: none;
        border: none;
        width: 100%;
        height: 100%;
        page-break-after: avoid;
      }
    }
  </style>
</head>
<body>

  <div class="no-print-bar">
    <a href="dashboard.html" class="btn-back">← Кабинетке қайту</a>
    <button class="btn-print" onclick="window.print()">🖨️ Басып шығару (Печать)</button>
  </div>

  <div class="card-print">
    <div class="border-inner"></div>

    <div class="card-top">
      <h1 class="event-couple-title" id="card-title">Жүктелуде...</h1>
      <p class="event-date-str" id="card-date">Күні белгіленбеген</p>
      <div class="instruction-lead">
        Смартфондар қош келдіңіздер!<br>Фото түсіріп, естелік қалдырыңыз
      </div>
    </div>

    <div class="qr-holder" id="qr-box"></div>

    <div class="card-bottom">
      <p class="guide-step">
        Камераңызды осы QR-кодқа бағыттаңыз.<br>
        Қосымша орнатудың қажеті жоқ!
      </p>
      <div class="brand-mark">ToyDuman • Цифрлық естелік альбомы</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://heuqifmvwrzkvtcarrdt.supabase.co";
    const SUPABASE_KEY = "sb_publishable_cOyPl30aOSb6pdxCRfRNQA_Tn6dBaZg";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const slug = new URLSearchParams(window.location.search).get('slug');

    async function init() {
      if (!slug) {
        document.getElementById('card-title').innerText = "Той коды жоқ";
        return;
      }

      const { data, error } = await supabaseClient
        .from('events')
        .select('*')
        .eq('slug', slug)
        .maybeSingle();

      if (error || !data) {
        document.getElementById('card-title').innerText = "Той табылмады";
        return;
      }

      document.getElementById('card-title').innerText = data.title;
      if (data.event_date) {
        document.getElementById('card-date').innerText = new Date(data.event_date).toLocaleDateString('kk-KZ');
      }

      const currentOrigin = window.location.origin + window.location.pathname.replace('print-qr.html', 'event.html');
      const guestLink = `${currentOrigin}?slug=${slug}`;

      new QRCode(document.getElementById('qr-box'), {
        text: guestLink,
        width: 175,
        height: 175,
        colorDark: "#121212",
        colorLight: "#ffffff"
      });
    }

    init();
  </script>
</body>
</html>
