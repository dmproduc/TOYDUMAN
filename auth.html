<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Кіру / Тіркелу — ToyDuman</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>

  <!-- Қазақ әріптерін 100% қолдайтын арнайы қаріптер -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #fcfbf9;
      --card-bg: #ffffff;
      --text: #121212;
      --text-muted: #737373;
      --border: #eae8e4;
      --accent: #121212;
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Onest', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    /* Басты карточка */
    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 400px;
      padding: 36px 28px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .brand-logo {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .auth-sub {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 26px;
    }

    /* Кіру / Тіркелу таңдау түймесі */
    .tab-switch {
      background: #f2f0eb;
      border-radius: 30px;
      padding: 4px;
      display: flex;
      width: 100%;
      margin-bottom: 22px;
    }
    .tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 9px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 24px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #ffffff;
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    /* Форма өрістері */
    .form-group {
      width: 100%;
      text-align: left;
      margin-bottom: 14px;
    }
    .form-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #444;
      display: block;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      background: #faf9f7;
      border: 1px solid var(--border);
      padding: 13px 14px;
      border-radius: 12px;
      font-size: 0.92rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .form-group input:focus {
      border-color: #121212;
      background: #ffffff;
    }

    /* Негізгі қара түйме */
    .btn-submit {
      width: 100%;
      background: #121212;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-submit:hover { opacity: 0.92; }
    .btn-submit:active { transform: scale(0.98); }

    /* Хабарлама блогы */
    .msg-box {
      width: 100%;
      font-size: 0.82rem;
      padding: 10px 12px;
      border-radius: 10px;
      margin-top: 14px;
      display: none;
      text-align: center;
    }
    .msg-box.error { background: #fef2f2; color: #dc2626; border: 1px solid #fee2e2; }
    .msg-box.success { background: #f0fdf4; color: #16a34a; border: 1px solid #dcfce7; }

    /* Артқа қайту сілтемесі */
    .back-home {
      margin-top: 24px;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.84rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }
    .back-home:hover { color: var(--text); }
  </style>
</head>
<body>

  <div class="auth-card">
    <a href="index.html" class="brand-logo">ToyDuman</a>
    <p class="auth-sub" id="form-subtitle">Жеке кабинетке кіру</p>

    <!-- Тәртіп ауыстыру: Кіру немесе Тіркелу -->
    <div class="tab-switch">
      <button type="button" class="tab-btn active" id="tab-login" onclick="setMode('login')">Кіру</button>
      <button type="button" class="tab-btn" id="tab-register" onclick="setMode('register')">Тіркелу</button>
    </div>

    <!-- Форма -->
    <div class="form-group">
      <label>Электронды пошта (Gmail):</label>
      <input type="email" id="email" placeholder="mysaly@gmail.com" required>
    </div>

    <div class="form-group">
      <label>Құпия сөз:</label>
      <input type="password" id="password" placeholder="Кемінде 6 таңба" required>
    </div>

    <button type="button" class="btn-submit" id="submit-btn" onclick="handleSubmit()">
      Кіру
    </button>

    <div class="msg-box" id="msg-box"></div>
  </div>

  <a href="index.html" class="back-home">← Басты бетке оралу</a>

  <script>
    const SUPABASE_URL = "https://heuqifmvwrzkvtcarrdt.supabase.co";
    const SUPABASE_KEY = "sb_publishable_cOyPl30aOSb6pdxCRfRNQA_Tn6dBaZg";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let isLoginMode = true;

    function setMode(mode) {
      isLoginMode = (mode === 'login');
      document.getElementById('tab-login').classList.toggle('active', isLoginMode);
      document.getElementById('tab-register').classList.toggle('active', !isLoginMode);
      
      document.getElementById('form-subtitle').innerText = isLoginMode ? 'Жеке кабинетке кіру' : 'Жаңа аккаунт ашу';
      document.getElementById('submit-btn').innerText = isLoginMode ? 'Кіру' : 'Тіркелу';
      hideMsg();
    }

    function showMsg(text, isError = true) {
      const box = document.getElementById('msg-box');
      box.className = `msg-box ${isError ? 'error' : 'success'}`;
      box.innerText = text;
      box.style.display = 'block';
    }

    function hideMsg() {
      document.getElementById('msg-box').style.display = 'none';
    }

    async function handleSubmit() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const btn = document.getElementById('submit-btn');

      if (!email || !password) {
        showMsg("Пошта мен құпия сөзді толық енгізіңіз!");
        return;
      }
      if (password.length < 6) {
        showMsg("Құпия сөз кемінде 6 таңбадан тұруы керек!");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Күте тұрыңыз...";
      hideMsg();

      try {
        if (isLoginMode) {
          // Кіру
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
          window.location.href = "dashboard.html";
        } else {
          // Тіркелу
          const { data, error } = await supabaseClient.auth.signUp({ email, password });
          if (error) throw error;
          
          if (data.session) {
            window.location.href = "dashboard.html";
          } else {
            showMsg("Тіркелу сәтті! Енді осы деректермен кіре аласыз.", false);
            setMode('login');
          }
        }
      } catch (err) {
        let errorMsg = err.message;
        if (errorMsg.includes("Invalid login credentials")) {
          errorMsg = "Пошта немесе құпия сөз қате!";
        } else if (errorMsg.includes("User already registered")) {
          errorMsg = "Бұл пошта бойынша аккаунт тіркеліп қойған. Кіру түймесін басыңыз.";
        }
        showMsg(errorMsg, true);
      } finally {
        btn.disabled = false;
        btn.innerText = isLoginMode ? 'Кіру' : 'Тіркелу';
      }
    }

    // Егер адам жүйеге кіріп қойған болса, бірден кабинетке жіберу
    async function autoRedirectIfLoggedIn() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        window.location.href = "dashboard.html";
      }
    }
    autoRedirectIfLoggedIn();
  </script>
</body>
</html>
