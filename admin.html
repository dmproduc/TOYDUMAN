<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Бас Админ Панелі — ToyDuman</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #fcfbf9;
      --card-bg: rgba(255, 255, 255, 0.9);
      --text: #121212;
      --text-muted: #6b7280;
      --border-subtle: rgba(0, 0, 0, 0.08);
      --radius: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Onest', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding: 18px 14px 60px 14px; }
    .container { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-subtle);
      flex-wrap: wrap;
      gap: 10px;
    }
    .logo {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text);
    }
    .admin-pill {
      background: #121212;
      color: #fff;
      font-size: 0.7rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-back-dash {
      background: rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-subtle);
      padding: 7px 14px;
      border-radius: 20px;
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: none;
      backdrop-filter: blur(8px);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.02);
      backdrop-filter: blur(10px);
    }
    .stat-val {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.9rem;
      font-weight: 700;
      margin-top: 2px;
      line-height: 1.1;
    }
    .stat-lbl { font-size: 0.76rem; color: var(--text-muted); font-weight: 600; }

    .search-box-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .search-box-row h3 {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .search-input {
      background: #fff;
      border: 1px solid var(--border-subtle);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.88rem;
      outline: none;
      width: 100%;
      max-width: 280px;
    }
    .search-input:focus { border-color: #121212; }

    .table-wrap {
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      overflow-x: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.03);
    }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; }
    th {
      background: rgba(0, 0, 0, 0.03);
      padding: 12px 14px;
      color: #4b5563;
      font-weight: 700;
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border-subtle);
      white-space: nowrap;
    }
    td { padding: 13px 14px; border-bottom: 1px solid var(--border-subtle); }
    tr:hover { background: rgba(0, 0, 0, 0.02); }

    .badge-vip {
      background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
      color: #92400e;
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.72rem;
      white-space: nowrap;
    }
    .badge-free {
      background: rgba(0, 0, 0, 0.05);
      color: #6b7280;
      border: 1px solid var(--border-subtle);
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.72rem;
      white-space: nowrap;
    }

    .btn-action {
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.76rem;
      cursor: pointer;
      border: none;
      white-space: nowrap;
      transition: transform 0.1s;
    }
    .btn-action:active { transform: scale(0.96); }
    .btn-give { background: #10b981; color: #fff; }
    .btn-revoke { background: #ef4444; color: #fff; }

    #denied-box {
      text-align: center;
      padding: 90px 20px;
      display: none;
    }
    #denied-box h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <div class="container" id="admin-content" style="display: none;">
    <header>
      <div class="logo">
        ToyDuman <span class="admin-pill">Админка</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <span id="current-user-email" style="font-size: 0.78rem; color: var(--text-muted); font-weight: 600;"></span>
        <a href="dashboard.html" class="btn-back-dash">← Кабинет</a>
      </div>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-lbl">Жалпы тойлар</div>
        <div class="stat-val" id="stat-total">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-lbl">VIP Альбомдар</div>
        <div class="stat-val" id="stat-vip" style="color: #b45309;">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-lbl">Тегін сынақтар</div>
        <div class="stat-val" id="stat-free" style="color: #6b7280;">0</div>
      </div>
    </div>

    <div class="search-box-row">
      <h3>Клиенттер тізімі</h3>
      <input type="text" id="search-box" class="search-input" placeholder="Аты, пошта немесе сілтеме..." oninput="filterEvents()">
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Пошта</th>
            <th>Той атауы</th>
            <th>Сілтеме</th>
            <th>Фото</th>
            <th>Күйі</th>
            <th>VIP Басқару</th>
          </tr>
        </thead>
        <tbody id="events-table-body">
          <tr><td colspan="6" style="text-align: center; color: #888; padding: 24px;">Деректер жүктелуде...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div id="denied-box">
    <h2>⛔ Қолжетімділік жабық</h2>
    <p style="color: #6b7280; font-size: 0.9rem;">Бұл парақша тек бас әкімшіге (guldanaih@gmail.com) арналған.</p>
    <a href="dashboard.html" class="btn-back-dash" style="display: inline-block; margin-top: 16px;">Кабинетке оралу</a>
  </div>

  <script>
    const SUPABASE_URL = "https://heuqifmvwrzkvtcarrdt.supabase.co";
    const SUPABASE_KEY = "sb_publishable_cOyPl30aOSb6pdxCRfRNQA_Tn6dBaZg";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const ADMIN_EMAIL = "guldanaih@gmail.com";

    let allEvents = [];
    let photoCounts = {};

    function getLocalUser() {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.includes('-auth-token')) {
          try {
            const data = JSON.parse(localStorage.getItem(key));
            if (data && data.user) return data.user;
          } catch(e) {}
        }
      }
      return null;
    }

    async function checkAuth() {
      const localUser = getLocalUser();
      let userEmail = localUser ? localUser.email : null;

      if (!userEmail) {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session && session.user) {
          userEmail = session.user.email;
        }
      }

      if (!userEmail || userEmail.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
        document.getElementById('denied-box').style.display = 'block';
        return;
      }

      document.getElementById('admin-content').style.display = 'flex';
      document.getElementById('current-user-email').innerText = userEmail;
      loadAdminData();
    }

    async function loadAdminData() {
      const { data: photos } = await supabaseClient.from('event_photos').select('event_id');
      photoCounts = {};
      if (photos) {
        photos.forEach(p => photoCounts[p.event_id] = (photoCounts[p.event_id] || 0) + 1);
      }

      const { data: events, error } = await supabaseClient
        .from('events')
        .select('*')
        .order('created_at', { ascending: false });

      if (error || !events) return;
      allEvents = events;

      const total = allEvents.length;
      const vipCount = allEvents.filter(e => e.plan_type === 'vip').length;
      document.getElementById('stat-total').innerText = total;
      document.getElementById('stat-vip').innerText = vipCount;
      document.getElementById('stat-free').innerText = total - vipCount;

      renderTable(allEvents);
    }

    function renderTable(list) {
      const tbody = document.getElementById('events-table-body');
      tbody.innerHTML = '';

      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #888; padding: 24px;">Ешқандай той табылмады</td></tr>';
        return;
      }

      const currentOrigin = window.location.origin + window.location.pathname.replace('admin.html', '');

      list.forEach(evt => {
        const isVip = evt.plan_type === 'vip';
        const count = photoCounts[evt.id] || 0;
        const guestLink = `${currentOrigin}event.html?slug=${evt.slug}`;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><b>${evt.user_email || '—'}</b></td>
          <td>${evt.title}</td>
          <td><a href="${guestLink}" target="_blank" style="color: #121212; text-decoration: underline; font-weight: 600;">${evt.slug} ↗</a></td>
          <td>📷 ${count}</td>
          <td><span class="${isVip ? 'badge-vip' : 'badge-free'}">${isVip ? 'VIP' : 'Тегін (25)'}</span></td>
          <td>
            ${!isVip ? `
              <button class="btn-action btn-give" onclick="toggleVip('${evt.id}', '${evt.title}', true)">
                ⚡ VIP қосу
              </button>
            ` : `
              <button class="btn-action btn-revoke" onclick="toggleVip('${evt.id}', '${evt.title}', false)">
                ❌ Алып тастау
              </button>
            `}
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function toggleVip(eventId, title, toVip) {
      const msg = toVip ? `"${title}" тойына VIP доступ бергіңіз келе ме?` : `"${title}" тойының VIP статусын алып тастайсыз ба?`;
      if (!confirm(msg)) return;

      const { error } = await supabaseClient
        .from('events')
        .update({
          plan_type: toVip ? 'vip' : 'free',
          shot_limit: toVip ? 9999 : 25,
          is_paid: toVip
        })
        .eq('id', eventId);

      if (!error) {
        loadAdminData();
      } else {
        alert("Қате: " + error.message);
      }
    }

    function filterEvents() {
      const q = document.getElementById('search-box').value.toLowerCase().trim();
      const filtered = allEvents.filter(e => 
        (e.title && e.title.toLowerCase().includes(q)) ||
        (e.slug && e.slug.toLowerCase().includes(q)) ||
        (e.user_email && e.user_email.toLowerCase().includes(q))
      );
      renderTable(filtered);
    }

    checkAuth();
  </script>
</body>
</html>
