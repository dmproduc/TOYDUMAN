<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Той қонағының парақшасы — ToyDuman</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent: #2563eb;
      --input-bg: #f8fafc;
      --shadow-sm: 0 4px 15px rgba(0,0,0,0.05);
    }

    [data-theme="dark"] {
      --bg: #0b0f17;
      --card-bg: #151d2a;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #263346;
      --accent: #3b82f6;
      --input-bg: #0b0f17;
      --shadow-sm: 0 4px 15px rgba(0,0,0,0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; transition: background-color 0.2s, color 0.2s, border-color 0.2s; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding: 16px; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 16px; }

    .top-controls { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .lang-switcher { display: flex; gap: 6px; }
    .lang-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-muted); padding: 5px 12px; border-radius: 20px; cursor: pointer; font-size: 0.78rem; font-weight: 700; }
    .lang-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .theme-toggle { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1rem; }

    .header { text-align: center; margin-top: 4px; }
    .header h1 { font-size: 1.45rem; font-weight: 800; color: var(--text); }
    .header p { font-size: 0.85rem; color: var(--accent); margin-top: 4px; font-weight: 600; }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 20px; box-shadow: var(--shadow-sm); }
    .counter { text-align: center; font-size: 0.88rem; margin-bottom: 14px; color: var(--accent); font-weight: 700; }

    .upload-zone {
      border: 2px dashed var(--accent);
      border-radius: 16px;
      padding: 22px 14px;
      text-align: center;
      cursor: pointer;
      background: rgba(37, 99, 235, 0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .upload-zone input { display: none; }
    .upload-zone span { font-size: 2.2rem; }
    .upload-zone p { font-size: 0.85rem; color: var(--text); font-weight: 600; }

    .preview-img { width: 100%; max-height: 240px; object-fit: contain; border-radius: 12px; display: none; margin-top: 12px; border: 1px solid var(--border); }

    .form-group { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
    label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }
    input, textarea { background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px; color: var(--text); font-size: 0.9rem; outline: none; width: 100%; }
    input:focus, textarea:focus { border-color: var(--accent); }

    .btn { background: var(--accent); color: #fff; border: none; padding: 14px; border-radius: 12px; font-weight: 700; cursor: pointer; width: 100%; font-size: 0.95rem; margin-top: 14px; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; }

    .msg { font-size: 0.85rem; text-align: center; padding: 10px; border-radius: 10px; display: none; margin-top: 12px; }
    .msg.error { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid #ef4444; }
    .msg.success { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid #10b981; }

    .feed-title { font-size: 1.15rem; font-weight: 800; color: var(--text); margin-top: 12px; }
    .feed { display: flex; flex-direction: column; gap: 14px; }
    .feed-item { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow-sm); }
    .feed-item img { width: 100%; display: block; max-height: 380px; object-fit: cover; }
    .feed-info { padding: 12px 14px; }
    .feed-author { font-weight: 700; color: var(--accent); font-size: 0.85rem; }
    .feed-caption { font-size: 0.85rem; color: var(--text); margin-top: 4px; }
    .empty-feed { text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 20px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-controls">
      <div class="lang-switcher">
        <button class="lang-btn active" id="btn-kz" onclick="setLang('kz')">KZ</button>
        <button class="lang-btn" id="btn-ru" onclick="setLang('ru')">RU</button>
      </div>
      <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()" title="Режимді ауыстыру">🌙</button>
    </div>

    <div class="header">
      <h1 id="event-title">Жүктелуде...</h1>
      <p id="event-subtitle">Сәтті сәттер мен ақ тілектер ✨</p>
    </div>

    <div class="card" id="form-card">
      <div class="counter" id="shot-counter">Қалған лимит: есептелуде...</div>

      <div class="upload-zone" onclick="document.getElementById('file-input').click()">
        <span>📸</span>
        <p id="lbl-upload">Фото түсіру немесе галереядан таңдау</p>
        <input type="file" id="file-input" accept="image/*" onchange="previewFile(event)">
      </div>

      <img id="preview" class="preview-img" alt="Preview">

      <div class="form-group">
        <label id="lbl-name">Сіздің есіміңіз:</label>
        <input type="text" id="guest-name" placeholder="Мысалы: Бауыржан">
      </div>

      <div class="form-group">
        <label id="lbl-wish">Ақ тілегіңіз (міндетті емес):</label>
        <textarea id="guest-wish" rows="2" placeholder="Бақытты болыңыздар!"></textarea>
      </div>

      <button class="btn" id="btn-send" onclick="uploadPhoto()">Жүктеу</button>
      <div class="msg" id="msg-box"></div>
    </div>

    <div class="feed-title" id="lbl-feed">Менің жүктеген естеліктерім</div>
    <div class="feed" id="feed-list"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://heuqifmvwrzkvtcarrdt.supabase.co";
    const SUPABASE_KEY = "sb_publishable_cOyPl30aOSb6pdxCRfRNQA_Tn6dBaZg";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const slug = urlParams.get('slug');

    let currentEvent = null;
    let compressedBlob = null;
    let guestLimit = 25;

    let myPhotosList = [];
    try {
      myPhotosList = JSON.parse(localStorage.getItem(`my_photos_${slug}`)) || [];
    } catch(e) {
      myPhotosList = [];
    }

    function initTheme() {
      const savedTheme = localStorage.getItem('toyduman_theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeBtn(savedTheme);
    }
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      const target = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', target);
      localStorage.setItem('toyduman_theme', target);
      updateThemeBtn(target);
    }
    function updateThemeBtn(theme) {
      document.getElementById('theme-btn').innerText = theme === 'dark' ? '☀️' : '🌙';
    }
    initTheme();

    const texts = {
      kz: {
        subtitle: "Сәтті сәттер мен ақ тілектер ✨",
        lblUpload: "Фото түсіру немесе галереядан таңдау",
        lblName: "Сіздің есіміңіз:",
        lblWish: "Ақ тілегіңіз (міндетті емес):",
        btnSend: "Жүктеу",
        feed: "Менің жүктеген естеліктерім",
        remain: "Қалған лимитіңіз: ",
        limitOver: "Сіз өз лимитіңізді толық пайдаландыңыз!",
        selectPhoto: "Алдымен фото таңдаңыз!",
        compressing: "Сурет оңтайландырылуда... ⚡",
        success: "Фото сәтті жүктелді! Рақмет!",
        notFound: "Іс-шара табылмады немесе жабық 😔",
        noPhotos: "Сіз әлі фото жүктеген жоқсыз 📷"
      },
      ru: {
        subtitle: "Памятные моменты и тёплые пожелания ✨",
        lblUpload: "Сделать фото или выбрать из галереи",
        lblName: "Ваше имя:",
        lblWish: "Ваше пожелание (необязательно):",
        btnSend: "Опубликовать",
        feed: "Мои загруженные фотографии",
        remain: "Ваш лимит: ",
        limitOver: "Вы исчерпали свой лимит кадров!",
        selectPhoto: "Сначала выберите фото!",
        compressing: "Оптимизация фото... ⚡",
        success: "Фото успешно опубликовано! Спасибо!",
        notFound: "Событие не найдено или закрыто 😔",
        noPhotos: "Вы еще не загружали фотографии 📷"
      }
    };

    let curLang = localStorage.getItem('toyduman_lang') || 'kz';

    function setLang(l) {
      curLang = l;
      localStorage.setItem('toyduman_lang', l);
      document.getElementById('btn-kz').classList.toggle('active', l === 'kz');
      document.getElementById('btn-ru').classList.toggle('active', l === 'ru');

      const t = texts[l];
      document.getElementById('event-subtitle').innerText = t.subtitle;
      document.getElementById('lbl-upload').innerText = t.lblUpload;
      document.getElementById('lbl-name').innerText = t.lblName;
      document.getElementById('lbl-wish').innerText = t.lblWish;
      document.getElementById('btn-send').innerText = t.btnSend;
      document.getElementById('lbl-feed').innerText = t.feed;
      updateLimitUI();
      renderMyFeed();
    }

    async function initEvent() {
      if (!slug) {
        document.getElementById('event-title').innerText = texts[curLang].notFound;
        document.getElementById('form-card').style.display = 'none';
        return;
      }

      const { data, error } = await supabaseClient
        .from('events')
        .select('*')
        .eq('slug', slug)
        .single();

      if (error || !data) {
        document.getElementById('event-title').innerText = texts[curLang].notFound;
        document.getElementById('form-card').style.display = 'none';
        return;
      }

      currentEvent = data;
      document.getElementById('event-title').innerText = currentEvent.title;
      guestLimit = currentEvent.shot_limit || 25;

      updateLimitUI();
      renderMyFeed();
    }

    function updateLimitUI() {
      const remain = Math.max(0, guestLimit - myPhotosList.length);
      const el = document.getElementById('shot-counter');
      if (guestLimit >= 999) {
        el.innerText = curLang === 'kz' ? "Шектеусіз кадр" : "Кадры без ограничений";
      } else {
        el.innerText = texts[curLang].remain + `${remain} / ${guestLimit}`;
      }

      if (remain <= 0 && guestLimit < 999) {
        document.getElementById('btn-send').disabled = true;
        document.getElementById('lbl-upload').innerText = texts[curLang].limitOver;
      }
    }

    // Фотоны автоматты түрде жеңілдету / қысу функциясы (Canvas Compression)
    function compressImage(file, maxWidth = 1400, quality = 0.8) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = event => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob(blob => {
              resolve(blob);
            }, 'image/jpeg', quality);
          };
          img.onerror = error => reject(error);
        };
        reader.onerror = error => reject(error);
      });
    }

    async function previewFile(e) {
      const file = e.target.files[0];
      if (!file) return;

      const btn = document.getElementById('btn-send');
      btn.innerText = texts[curLang].compressing;
      btn.disabled = true;

      try {
        // Телефонда суретті бірден қысамыз (1-2 МБ болып қалады)
        compressedBlob = await compressImage(file, 1400, 0.82);
        const img = document.getElementById('preview');
        img.src = URL.createObjectURL(compressedBlob);
        img.style.display = 'block';
      } catch (err) {
        compressedBlob = file;
      } finally {
        btn.innerText = texts[curLang].btnSend;
        btn.disabled = false;
      }
    }

    async function uploadPhoto() {
      if (!compressedBlob) {
        alert(texts[curLang].selectPhoto);
        return;
      }

      const btn = document.getElementById('btn-send');
      const msgBox = document.getElementById('msg-box');
      btn.disabled = true;
      btn.innerText = curLang === 'kz' ? "Жүктелуде... ⏳" : "Загрузка... ⏳";

      try {
        const fileName = `${currentEvent.id}/${Date.now()}_${Math.random().toString(36).substring(7)}.jpg`;

        const { error: uploadErr } = await supabaseClient.storage
          .from('photos')
          .upload(fileName, compressedBlob, { contentType: 'image/jpeg' });

        if (uploadErr) throw uploadErr;

        const { data: urlData } = supabaseClient.storage
          .from('photos')
          .getPublicUrl(fileName);

        const publicUrl = urlData.publicUrl;
        const author = document.getElementById('guest-name').value.trim() || 'Қонақ';
        const wish = document.getElementById('guest-wish').value.trim();

        const { error: dbErr } = await supabaseClient
          .from('event_photos')
          .insert([{
            event_id: currentEvent.id,
            photo_url: publicUrl,
            author_name: author,
            wishes: wish
          }]);

        if (dbErr) throw dbErr;

        myPhotosList.unshift({
          photo_url: publicUrl,
          author_name: author,
          wishes: wish
        });
        localStorage.setItem(`my_photos_${slug}`, JSON.stringify(myPhotosList));

        updateLimitUI();
        renderMyFeed();

        msgBox.className = 'msg success';
        msgBox.innerText = texts[curLang].success;
        msgBox.style.display = 'block';

        document.getElementById('preview').style.display = 'none';
        document.getElementById('file-input').value = '';
        document.getElementById('guest-wish').value = '';
        compressedBlob = null;

        setTimeout(() => { msgBox.style.display = 'none'; }, 3000);

      } catch (err) {
        msgBox.className = 'msg error';
        msgBox.innerText = "Қате: " + err.message;
        msgBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerText = texts[curLang].btnSend;
      }
    }

    function renderMyFeed() {
      const feedBox = document.getElementById('feed-list');
      feedBox.innerHTML = '';

      if (myPhotosList.length === 0) {
        feedBox.innerHTML = `<div class="empty-feed">${texts[curLang].noPhotos}</div>`;
        return;
      }

      myPhotosList.forEach(item => {
        const div = document.createElement('div');
        div.className = 'feed-item';
        div.innerHTML = `
          <img src="${item.photo_url}" loading="lazy">
          <div class="feed-info">
            <div class="feed-author">👤 ${item.author_name} (Сіз)</div>
            ${item.wishes ? `<div class="feed-caption">💬 ${item.wishes}</div>` : ''}
          </div>
        `;
        feedBox.appendChild(div);
      });
    }

    setLang(curLang);
    initEvent();
  </script>
</body>
</html>
