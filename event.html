<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Цифрлық Камера — ToyDuman</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,400&family=Space+Mono:wght@700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: #0d0d0d;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 50px;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      padding: 12px 16px;
    }

    /* Жоғарғы тақырыпша: Аты және статус */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 4px 14px 4px;
    }
    .event-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.2px;
      color: #f5f5f5;
    }
    .badge-sent {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e5e5e5;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Камераның ортаңғы видоискатель терезесі (Viewfinder) */
    .viewfinder-card {
      width: 100%;
      height: 380px;
      background: #1a1a1a;
      border-radius: 28px;
      overflow: hidden;
      position: relative;
      border: 1px solid #2a2a2a;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-bg-preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.65);
    }

    .camera-frame-overlay {
      position: absolute;
      inset: 16px;
      border: 1px dashed rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
    }
    .frame-center-cross {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255, 255, 255, 0.35);
      font-size: 1.5rem;
      font-weight: 300;
    }
    .frame-hint {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.6);
      text-align: center;
      margin-top: auto;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
    }

    .preview-capture {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      z-index: 10;
    }

    /* Камераның төменгі басқару құралдары */
    .controls-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-top: 20px;
    }

    .btn-gallery-select {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 9px 20px;
      border-radius: 30px;
      font-size: 0.82rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }
    .btn-gallery-select input { display: none; }

    /* Ретро санауыш (Film Counter: 10 11 12) */
    .film-counter-strip {
      background: #181818;
      border: 1px solid #282828;
      border-radius: 22px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: 'Space Mono', monospace;
    }
    .counter-num {
      font-size: 0.85rem;
      color: #555;
      font-weight: 700;
    }
    .counter-current {
      font-size: 1.05rem;
      color: #fff;
      background: #2a2a2a;
      padding: 2px 10px;
      border-radius: 12px;
      border: 1px solid #444;
    }

    /* Үлкен дөңгелек түсіру түймесі (Shutter button) */
    .shutter-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
    }
    .shutter-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #ffffff;
      border: 4px solid #333333;
      box-shadow: 0 0 0 4px #1a1a1a, 0 10px 24px rgba(0,0,0,0.5);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s;
    }
    .shutter-btn:active {
      transform: scale(0.92);
      background: #e0e0e0;
    }
    .shutter-inner {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 2px solid #000;
    }

    /* Модаль: Сурет түсіргеннен кейінгі есім мен тілек */
    .caption-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(12px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .caption-box {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 24px;
      width: 100%;
      max-width: 400px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .caption-box h4 {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      color: #fff;
    }
    .caption-input {
      background: #0d0d0d;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 12px 14px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      width: 100%;
    }
    .caption-input:focus { border-color: #fff; }
    .btn-send-final {
      background: #fff;
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
    }

    /* Төменгі 2 қатарлы эстетикалық фотолента */
    .feed-section {
      margin-top: 36px;
      width: 100%;
    }
    .feed-heading {
      font-size: 0.88rem;
      font-weight: 600;
      color: #888;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .feed-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .feed-card {
      background: #181818;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #262626;
      display: flex;
      flex-direction: column;
    }
    .feed-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #111;
      display: block;
    }
    .feed-meta {
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .feed-author {
      font-size: 0.75rem;
      font-weight: 700;
      color: #eee;
    }
    .feed-wish {
      font-size: 0.72rem;
      color: #999;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Шапка -->
    <div class="header-bar">
      <div class="event-name" id="event-title">Жүктелуде...</div>
      <div class="badge-wrap">
        <span class="badge-sent" id="shots-badge">✓ 25 кадр</span>
      </div>
    </div>

    <!-- Камераның ортаңғы видоискателі -->
    <div class="viewfinder-card">
      <img id="bg-cover" class="hero-bg-preview" src="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=800&q=80" alt="Cover">
      
      <div class="camera-frame-overlay">
        <div style="font-size: 0.68rem; color: rgba(255,255,255,0.4); text-transform: uppercase;">ToyDuman Cam • 35mm</div>
        <div class="frame-center-cross">+</div>
        <div class="frame-hint" id="frame-hint">Төмендегі ақ түймені басып фото түсіріңіз</div>
      </div>

      <img id="preview-img" class="preview-capture" alt="Preview">
    </div>

    <!-- Басқару құралдары -->
    <div class="controls-panel">
      
      <!-- Галереядан таңдау түймесі -->
      <label class="btn-gallery-select">
        <span>🖼️</span> Галереядан қосу
        <input type="file" id="file-input" accept="image/*" onchange="handleFile(event)">
      </label>

      <!-- Ретро лента санауышы (10 - 11 - 12) -->
      <div class="film-counter-strip">
        <span class="counter-num" id="cnt-prev">23</span>
        <span class="counter-current" id="cnt-cur">24</span>
        <span class="counter-num" id="cnt-next">25</span>
      </div>

      <!-- Камераның негізгі түймесі (Шуттер) -->
      <div class="shutter-wrapper">
        <button class="shutter-btn" onclick="triggerCamera()" title="Фото түсіру">
          <div class="shutter-inner"></div>
        </button>
      </div>

    </div>

    <!-- Төменгі 2 қатарлы эстетикалық лента -->
    <div class="feed-section">
      <div class="feed-heading">
        <span>Түсірілген кадрлар</span>
        <span id="feed-count">0 фото</span>
      </div>
      <div class="feed-grid" id="feed-grid"></div>
    </div>

  </div>

  <!-- Модаль: Түсіргеннен кейін есім мен тілек жазу -->
  <div class="caption-modal" id="caption-modal">
    <div class="caption-box">
      <h4>Кадр түсірілді! 📸</h4>
      <input type="text" id="guest-name" class="caption-input" placeholder="Сіздің есіміңіз (мысалы: Аружан)">
      <textarea id="guest-wish" class="caption-input" rows="2" placeholder="Ақ тілегіңіз (міндетті емес)"></textarea>
      <button class="btn-send-final" id="btn-save" onclick="uploadPhoto()">Альбомға жолдау</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://heuqifmvwrzkvtcarrdt.supabase.co";
    const SUPABASE_KEY = "sb_publishable_cOyPl30aOSb6pdxCRfRNQA_Tn6dBaZg";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const slug = new URLSearchParams(window.location.search).get('slug');

    let currentEvent = null;
    let compressedBlob = null;
    let guestLimit = 25;
    let myPhotos = [];

    try {
      myPhotos = JSON.parse(localStorage.getItem(`td_shots_${slug}`)) || [];
    } catch(e) { myPhotos = []; }

    async function init() {
      if (!slug) return;
      const { data, error } = await supabaseClient.from('events').select('*').eq('slug', slug).single();
      if (error || !data) return;

      currentEvent = data;
      document.getElementById('event-title').innerText = currentEvent.title;
      guestLimit = currentEvent.shot_limit || 25;

      if (currentEvent.cover_url) {
        document.getElementById('bg-cover').src = currentEvent.cover_url;
      }

      updateCounterUI();
      renderFeed();
    }

    function updateCounterUI() {
      const remain = Math.max(0, guestLimit - myPhotos.length);
      document.getElementById('cnt-cur').innerText = remain;
      document.getElementById('cnt-prev').innerText = Math.max(0, remain - 1);
      document.getElementById('cnt-next').innerText = remain + 1;
      document.getElementById('shots-badge').innerText = `✓ ${remain} кадр қалды`;

      if (remain === 0 && guestLimit < 999) {
        document.getElementById('frame-hint').innerText = "Кадр лимиті аяқталды 😔";
      }
    }

    function triggerCamera() {
      const remain = Math.max(0, guestLimit - myPhotos.length);
      if (remain <= 0 && guestLimit < 999) {
        alert("Сіз барлық кадрларыңызды пайдаландыңыз!");
        return;
      }
      // Камераны бірден ашу
      document.getElementById('file-input').click();
    }

    // Фотоны қысу (Compress)
    function compressImage(file, maxWidth = 1200, quality = 0.82) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = e => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > maxWidth) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            canvas.toBlob(blob => resolve(blob), 'image/jpeg', quality);
          };
        };
      });
    }

    async function handleFile(e) {
      const file = e.target.files[0];
      if (!file) return;

      compressedBlob = await compressImage(file);
      const preview = document.getElementById('preview-img');
      preview.src = URL.createObjectURL(compressedBlob);
      preview.style.display = 'block';

      // Модальді терезені ашу
      document.getElementById('caption-modal').style.display = 'flex';
    }

    async function uploadPhoto() {
      if (!compressedBlob) return;

      const btn = document.getElementById('btn-save');
      btn.disabled = true;
      btn.innerText = "Сақталуда... ⏳";

      try {
        const fileName = `${currentEvent.id}/${Date.now()}_img.jpg`;
        await supabaseClient.storage.from('photos').upload(fileName, compressedBlob, { contentType: 'image/jpeg' });
        const { data: urlData } = supabaseClient.storage.from('photos').getPublicUrl(fileName);
        const photoUrl = urlData.publicUrl;

        const author = document.getElementById('guest-name').value.trim() || 'Қонақ';
        const wish = document.getElementById('guest-wish').value.trim() || '';

        await supabaseClient.from('event_photos').insert([{
          event_id: currentEvent.id,
          photo_url: photoUrl,
          author_name: author,
          wishes: wish
        }]);

        myPhotos.unshift({ photo_url: photoUrl, author_name: author, wishes: wish });
        localStorage.setItem(`td_shots_${slug}`, JSON.stringify(myPhotos));

        // Жабу және тазалау
        document.getElementById('caption-modal').style.display = 'none';
        document.getElementById('preview-img').style.display = 'none';
        document.getElementById('guest-wish').value = '';
        document.getElementById('file-input').value = '';
        compressedBlob = null;

        updateCounterUI();
        renderFeed();
      } catch (err) {
        alert("Қате: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "Альбомға жолдау";
      }
    }

    function renderFeed() {
      const grid = document.getElementById('feed-grid');
      grid.innerHTML = '';
      document.getElementById('feed-count').innerText = `${myPhotos.length} фото`;

      if (myPhotos.length === 0) {
        grid.innerHTML = '<div style="grid-column: span 2; text-align: center; color: #555; padding: 20px; font-size: 0.8rem;">Әзірге түсірілген кадр жоқ</div>';
        return;
      }

      myPhotos.forEach(item => {
        const div = document.createElement('div');
        div.className = 'feed-card';
        div.innerHTML = `
          <img class="feed-img" src="${item.photo_url}" loading="lazy">
          <div class="feed-meta">
            <span class="feed-author">👤 ${item.author_name}</span>
            ${item.wishes ? `<span class="feed-wish">💬 ${item.wishes}</span>` : ''}
          </div>
        `;
        grid.appendChild(div);
      });
    }

    init();
  </script>
</body>
</html>
