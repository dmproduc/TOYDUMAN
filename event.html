<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Той қонағының парақшасы — ToyDuman</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #faf7f2;
      --card-bg: #ffffff;
      --text: #1c1917;
      --text-muted: #78716c;
      --accent: #d97706;
      --border: #e7e5e4;
      --shadow: 0 10px 25px -5px rgba(0,0,0,0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 50px; display: flex; flex-direction: column; align-items: center; }

    .hero-banner {
      width: 100%; height: 230px; position: relative;
      background: linear-gradient(180deg, rgba(0,0,0,0.1), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1200&q=80') center/cover;
      display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding: 20px; text-align: center; color: #fff;
    }
    .hero-title { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 800; text-shadow: 0 2px 8px rgba(0,0,0,0.6); }
    .timer-wrap { margin-top: 8px; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); padding: 6px 14px; border-radius: 30px; font-size: 0.75rem; font-weight: 700; color: #fef3c7; }

    .container { width: 100%; max-width: 480px; padding: 0 16px; margin-top: -20px; z-index: 10; display: flex; flex-direction: column; gap: 16px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 20px; box-shadow: var(--shadow); }
    .counter { text-align: center; font-size: 0.88rem; margin-bottom: 12px; color: var(--accent); font-weight: 700; }

    .upload-zone { border: 2px dashed var(--accent); border-radius: 16px; padding: 20px 14px; text-align: center; cursor: pointer; background: rgba(217, 119, 6, 0.04); display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .upload-zone input { display: none; }
    .preview-img { width: 100%; max-height: 240px; object-fit: contain; border-radius: 12px; display: none; margin-top: 10px; border: 1px solid var(--border); }

    /* Голосовой жазу батырмасы */
    .audio-recorder-box {
      margin-top: 12px; background: #fdfaf6; border: 1px dashed var(--border); border-radius: 14px; padding: 12px; display: flex; align-items: center; justify-content: space-between;
    }
    .btn-record { background: #ef4444; color: #fff; border: none; padding: 9px 15px; border-radius: 20px; font-size: 0.82rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .btn-record.recording { animation: pulse 1s infinite; background: #dc2626; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .audio-status { font-size: 0.78rem; color: var(--text-muted); font-weight: 600; }

    .form-group { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
    label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }
    input, textarea { background: #faf7f2; border: 1px solid var(--border); border-radius: 12px; padding: 12px; color: var(--text); font-size: 0.9rem; outline: none; width: 100%; }

    .btn { background: var(--accent); color: #fff; border: none; padding: 14px; border-radius: 12px; font-weight: 700; cursor: pointer; width: 100%; font-size: 0.95rem; margin-top: 14px; }
    .msg { font-size: 0.85rem; text-align: center; padding: 10px; border-radius: 10px; display: none; margin-top: 12px; }
    .msg.error { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
    .msg.success { background: rgba(16, 185, 129, 0.1); color: #10b981; }

    /* Polaroid естеліктер */
    .feed-title { font-size: 1.2rem; font-weight: 800; color: var(--text); margin-top: 14px; text-align: center; }
    .feed { display: flex; flex-direction: column; gap: 24px; padding: 10px 4px; }
    .polaroid-card { background: #ffffff; padding: 12px 12px 18px 12px; border-radius: 4px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); border: 1px solid rgba(0,0,0,0.06); }
    .polaroid-img { width: 100%; height: 300px; object-fit: cover; display: block; border-radius: 2px; }
    .polaroid-content { padding: 12px 6px 4px 6px; text-align: center; }
    .polaroid-wish { font-family: 'Caveat', cursive; font-size: 1.45rem; color: #1e293b; line-height: 1.25; margin-bottom: 6px; }
    .polaroid-author { font-size: 0.8rem; font-weight: 700; color: #b45309; text-transform: uppercase; }
    .audio-player-custom { width: 100%; height: 34px; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="hero-banner">
    <h1 class="hero-title" id="event-title">Жүктелуде...</h1>
    <div class="timer-wrap" id="timer-box">
      <span id="timer-val">Есептелуде...</span>
    </div>
  </div>

  <div class="container">
    <div class="card" id="form-card">
      <div class="counter" id="shot-counter">Қалған лимит: есептелуде...</div>

      <div class="upload-zone" onclick="document.getElementById('file-input').click()">
        <span style="font-size: 2.2rem;">📸</span>
        <p style="font-weight: 600;">Камерамен түсіру немесе галереядан таңдау</p>
        <input type="file" id="file-input" accept="image/*" onchange="previewFile(event)">
      </div>
      <img id="preview" class="preview-img" alt="Preview">

      <!-- Дауыстық тілек (Голосовое) жазу блогы -->
      <div class="audio-recorder-box">
        <button type="button" class="btn-record" id="rec-btn" onclick="toggleRecording()">
          <span id="rec-icon">🎙️</span> <span id="rec-txt">Дауысты тілек жазу</span>
        </button>
        <span class="audio-status" id="rec-status">Жазылмаған</span>
      </div>
      <audio id="recorded-audio-preview" controls style="width: 100%; display: none; margin-top: 10px; height: 32px;"></audio>

      <div class="form-group">
        <label>Сіздің есіміңіз:</label>
        <input type="text" id="guest-name" placeholder="Мысалы: Бауыржан">
      </div>

      <div class="form-group">
        <label>Жас жұбайларға ақ тілек:</label>
        <textarea id="guest-wish" rows="2" placeholder="Бақытты болыңыздар, мәңгі бірге!"></textarea>
      </div>

      <button class="btn" id="btn-send" onclick="uploadPhoto()">✨ Естелікті Polaroid етіп сақтау</button>
      <div class="msg" id="msg-box"></div>
    </div>

    <div class="feed-title">🎞️ Менің Polaroid естеліктерім</div>
    <div class="feed" id="feed-list"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://heuqifmvwrzkvtcarrdt.supabase.co";
    const SUPABASE_KEY = "sb_publishable_cOyPl30aOSb6pdxCRfRNQA_Tn6dBaZg";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const slug = new URLSearchParams(window.location.search).get('slug');

    let currentEvent = null;
    let compressedBlob = null;
    let guestLimit = 25;

    // ДЫБЫС ЖАЗУ ЖӘНЕ АВТОМАТТЫ ФОРМАТ ТАҢДАУ
    let mediaRecorder = null;
    let audioChunks = [];
    let audioBlob = null;
    let isRecording = false;
    let selectedMimeType = '';

    let myPhotosList = [];
    try {
      myPhotosList = JSON.parse(localStorage.getItem(`my_photos_${slug}`)) || [];
    } catch(e) { myPhotosList = []; }

    // Телефонның қай форматты қолдайтынын анықтау
    function getSupportedMimeType() {
      const types = [
        'audio/mp4',
        'audio/aac',
        'audio/webm;codecs=opus',
        'audio/webm',
        'audio/ogg'
      ];
      for (let t of types) {
        if (MediaRecorder.isTypeSupported(t)) {
          return t;
        }
      }
      return '';
    }

    async function toggleRecording() {
      const recBtn = document.getElementById('rec-btn');
      const recStatus = document.getElementById('rec-status');

      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          
          selectedMimeType = getSupportedMimeType();
          const options = selectedMimeType ? { mimeType: selectedMimeType } : {};
          
          mediaRecorder = new MediaRecorder(stream, options);
          audioChunks = [];

          mediaRecorder.ondataavailable = e => {
            if (e.data.size > 0) audioChunks.push(e.data);
          };

          mediaRecorder.onstop = () => {
            const mime = selectedMimeType || 'audio/webm';
            audioBlob = new Blob(audioChunks, { type: mime });
            const preview = document.getElementById('recorded-audio-preview');
            preview.src = URL.createObjectURL(audioBlob);
            preview.style.display = 'block';
            recStatus.innerText = "✅ Дайын (тыңдап көріңіз)";
          };

          mediaRecorder.start();
          isRecording = true;
          recBtn.classList.add('recording');
          document.getElementById('rec-txt').innerText = "Тоқтату ⏹️";
          recStatus.innerText = "🔴 Жазылуда...";
        } catch (err) {
          alert("Микрофонға рұқсат беріңіз: " + err.message);
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recBtn.classList.remove('recording');
        document.getElementById('rec-txt').innerText = "Қайта жазу 🎙️";
      }
    }

    async function initEvent() {
      if (!slug) return;
      const { data, error } = await supabaseClient.from('events').select('*').eq('slug', slug).single();
      if (error || !data) return;

      currentEvent = data;
      document.getElementById('event-title').innerText = currentEvent.title;
      guestLimit = currentEvent.shot_limit || 25;

      startTimer(currentEvent.event_date);
      updateLimitUI();
      renderPolaroidFeed();
    }

    function startTimer(targetDateStr) {
      if (!targetDateStr) {
        document.getElementById('timer-box').style.display = 'none';
        return;
      }
      const targetDate = new Date(targetDateStr).getTime();
      function update() {
        const diff = targetDate - new Date().getTime();
        if (diff <= 0) {
          document.getElementById('timer-val').innerText = "🎉 Мереке басталды! 🎉";
          return;
        }
        const d = Math.floor(diff / (1000 * 60 * 60 * 24));
        const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        document.getElementById('timer-val').innerText = `⏳ Тойға дейін: ${d} күн ${h} сағат ${m} мин`;
      }
      update();
      setInterval(update, 60000);
    }

    function updateLimitUI() {
      const remain = Math.max(0, guestLimit - myPhotosList.length);
      const el = document.getElementById('shot-counter');
      el.innerText = guestLimit >= 999 ? "Шектеусіз кадр" : `Қалған лимит: ${remain} / ${guestLimit}`;
    }

    function compressImage(file, maxWidth = 1200, quality = 0.8) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = e => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > maxWidth) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            canvas.toBlob(blob => resolve(blob), 'image/jpeg', quality);
          };
        };
      });
    }

    async function previewFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      compressedBlob = await compressImage(file, 1200, 0.82);
      const img = document.getElementById('preview');
      img.src = URL.createObjectURL(compressedBlob);
      img.style.display = 'block';
    }

    async function uploadPhoto() {
      if (!compressedBlob) { alert("Алдымен фото таңдаңыз!"); return; }

      const btn = document.getElementById('btn-send');
      const msgBox = document.getElementById('msg-box');
      btn.disabled = true;
      btn.innerText = "Polaroid дайындалуда... ⏳";

      try {
        const photoName = `${currentEvent.id}/${Date.now()}_img.jpg`;
        await supabaseClient.storage.from('photos').upload(photoName, compressedBlob, { contentType: 'image/jpeg' });
        const { data: urlData } = supabaseClient.storage.from('photos').getPublicUrl(photoName);
        const photoUrl = urlData.publicUrl;

        let finalAudioUrl = null;
        if (audioBlob) {
          const ext = selectedMimeType.includes('mp4') ? 'mp4' : 'webm';
          const audioName = `${currentEvent.id}/${Date.now()}_voice.${ext}`;
          
          await supabaseClient.storage.from('photos').upload(audioName, audioBlob, { 
            contentType: audioBlob.type || 'audio/webm' 
          });
          
          const { data: audioData } = supabaseClient.storage.from('photos').getPublicUrl(audioName);
          finalAudioUrl = audioData.publicUrl;
        }

        const author = document.getElementById('guest-name').value.trim() || 'Қонақ';
        const wish = document.getElementById('guest-wish').value.trim() || 'Бақытты болыңыздар!';

        await supabaseClient.from('event_photos').insert([{
          event_id: currentEvent.id,
          photo_url: photoUrl,
          author_name: author,
          wishes: wish,
          audio_url: finalAudioUrl
        }]);

        myPhotosList.unshift({ photo_url: photoUrl, author_name: author, wishes: wish, audio_url: finalAudioUrl });
        localStorage.setItem(`my_photos_${slug}`, JSON.stringify(myPhotosList));

        updateLimitUI();
        renderPolaroidFeed();

        msgBox.className = 'msg success';
        msgBox.innerText = "✨ Polaroid естелігі сәтті сақталды!";
        msgBox.style.display = 'block';

        document.getElementById('preview').style.display = 'none';
        document.getElementById('file-input').value = '';
        document.getElementById('guest-wish').value = '';
        document.getElementById('recorded-audio-preview').style.display = 'none';
        document.getElementById('rec-status').innerText = 'Жазылмаған';
        compressedBlob = null;
        audioBlob = null;

        setTimeout(() => msgBox.style.display = 'none', 3000);
      } catch (err) {
        msgBox.className = 'msg error';
        msgBox.innerText = "Қате: " + err.message;
        msgBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerText = "✨ Естелікті Polaroid етіп сақтау";
      }
    }

    function renderPolaroidFeed() {
      const feed = document.getElementById('feed-list');
      feed.innerHTML = '';
      if (myPhotosList.length === 0) {
        feed.innerHTML = '<div style="text-align:center; color:#78716c; font-size:0.85rem; padding:20px;">Әзірге фотолар жоқ 📷</div>';
        return;
      }
      myPhotosList.forEach(item => {
        const div = document.createElement('div');
        div.className = 'polaroid-card';
        div.innerHTML = `
          <img class="polaroid-img" src="${item.photo_url}" loading="lazy">
          <div class="polaroid-content">
            <div class="polaroid-wish">"${item.wishes}"</div>
            <div class="polaroid-author">❤️ ${item.author_name}</div>
            ${item.audio_url ? `
              <audio class="audio-player-custom" controls preload="none">
                <source src="${item.audio_url}">
              </audio>
            ` : ''}
          </div>
        `;
        feed.appendChild(div);
      });
    }

    initEvent();
  </script>
</body>
</html>
