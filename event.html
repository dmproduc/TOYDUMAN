<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Той қонағының парақшасы — ToyDuman</title>

  <!-- Жаңа Supabase JS кітапханасы -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0c10; color: #c5c6c7; min-height: 100vh; padding: 15px; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }

    .header { text-align: center; margin-top: 10px; }
    .header h1 { font-size: 1.5rem; color: #fff; }
    .header p { font-size: 0.85rem; color: #45a29e; margin-top: 4px; }

    .lang-switcher { display: flex; justify-content: center; gap: 6px; }
    .lang-btn { background: #1f2833; border: 1px solid #45a29e; color: #c5c6c7; padding: 4px 10px; border-radius: 8px; cursor: pointer; font-size: 0.75rem; }
    .lang-btn.active { background: #66fcf1; color: #0b0c10; font-weight: bold; }

    .card { background: #1f2833; border: 1px solid #2f3e46; border-radius: 16px; padding: 18px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }

    .counter { text-align: center; font-size: 0.9rem; margin-bottom: 12px; color: #66fcf1; font-weight: 600; }

    .upload-zone {
      border: 2px dashed #45a29e;
      border-radius: 12px;
      padding: 20px 10px;
      text-align: center;
      cursor: pointer;
      background: rgba(102, 252, 241, 0.03);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .upload-zone input { display: none; }
    .upload-zone span { font-size: 2rem; }
    .upload-zone p { font-size: 0.85rem; color: #fff; }

    .preview-img { width: 100%; max-height: 220px; object-fit: contain; border-radius: 8px; display: none; margin-top: 10px; }

    .form-group { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
    label { font-size: 0.8rem; color: #aaa; }
    input, textarea { background: #0b0c10; border: 1px solid #45a29e; border-radius: 8px; padding: 10px; color: #fff; font-size: 0.9rem; outline: none; width: 100%; }

    .btn { background: #66fcf1; color: #0b0c10; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; font-size: 0.95rem; margin-top: 12px; }
    .btn:disabled { opacity: 0.5; }

    .msg { font-size: 0.85rem; text-align: center; padding: 8px; border-radius: 6px; display: none; margin-top: 10px; }
    .msg.error { background: rgba(255, 77, 77, 0.15); color: #ff6b6b; border: 1px solid #ff6b6b; }
    .msg.success { background: rgba(102, 252, 241, 0.15); color: #66fcf1; border: 1px solid #66fcf1; }

    .feed-title { font-size: 1.1rem; color: #fff; margin-top: 10px; }
    .feed { display: flex; flex-direction: column; gap: 12px; }
    .feed-item { background: #1f2833; border: 1px solid #2f3e46; border-radius: 12px; overflow: hidden; }
    .feed-item img { width: 100%; display: block; max-height: 350px; object-fit: cover; }
    .feed-info { padding: 10px 12px; }
    .feed-author { font-weight: 700; color: #66fcf1; font-size: 0.85rem; }
    .feed-caption { font-size: 0.85rem; color: #ddd; margin-top: 4px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="lang-switcher">
      <button class="lang-btn active" id="btn-kz" onclick="setLang('kz')">KZ</button>
      <button class="lang-btn" id="btn-ru" onclick="setLang('ru')">RU</button>
    </div>

    <div class="header">
      <h1 id="event-title">Жүктелуде...</h1>
      <p id="event-subtitle">Үйлену тойы • Сәтті сәттер мен ақ тілектер ✨</p>
    </div>

    <div class="card" id="form-card">
      <div class="counter" id="shot-counter">Қалған лимит: есептелуде...</div>

      <div class="upload-zone" onclick="document.getElementById('file-input').click()">
        <span>📸</span>
        <p id="lbl-upload">Фото түсіру немесе галереядан таңдау</p>
        <input type="file" id="file-input" accept="image/*" onchange="previewFile(event)">
      </div>

      <img id="preview" class="preview-img" alt="Preview">

      <div class="form-group">
        <label id="lbl-name">Сіздің есіміңіз:</label>
        <input type="text" id="guest-name" placeholder="Мысалы: Бауыржан">
      </div>

      <div class="form-group">
        <label id="lbl-wish">Жас жұбайларға тілек (міндетті емес):</label>
        <textarea id="guest-wish" rows="2" placeholder="Бақытты болыңыздар!"></textarea>
      </div>

      <button class="btn" id="btn-send" onclick="uploadPhoto()">Жүктеу</button>
      <div class="msg" id="msg-box"></div>
    </div>

    <div class="feed-title" id="lbl-feed">Той естеліктері (Лента)</div>
    <div class="feed" id="feed-list"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://heuqifmvwrzkvtcarrdt.supabase.co";
    const SUPABASE_KEY = "sb_publishable_cOyPl30aOSb6pdxCRfRNQA_Tn6dBaZg";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const slug = urlParams.get('slug');

    let currentEvent = null;
    let selectedFile = null;
    let guestLimit = 25;
    let uploadedCount = 0;

    const texts = {
      kz: {
        subtitle: "Үйлену тойы • Сәтті сәттер мен ақ тілектер ✨",
        lblUpload: "Фото түсіру немесе галереядан таңдау",
        lblName: "Сіздің есіміңіз:",
        lblWish: "Жас жұбайларға тілек (міндетті емес):",
        btnSend: "Жүктеу",
        feed: "Той естеліктері (Лента)",
        remain: "Қалған лимитіңіз: ",
        limitOver: "Сіз өз лимитіңізді толық пайдаландыңыз!",
        selectPhoto: "Алдымен фото таңдаңыз!",
        success: "Фото сәтті жүктелді! Рақмет!",
        notFound: "Той табылмады немесе жабық 😔"
      },
      ru: {
        subtitle: "Свадебное торжество • Памятные моменты и пожелания ✨",
        lblUpload: "Сделать фото или выбрать из галереи",
        lblName: "Ваше имя:",
        lblWish: "Пожелание молодожёнам (необязательно):",
        btnSend: "Опубликовать",
        feed: "Лента воспоминаний",
        remain: "Ваш лимит: ",
        limitOver: "Вы исчерпали свой лимит кадров!",
        selectPhoto: "Сначала выберите фото!",
        success: "Фото успешно опубликовано! Спасибо!",
        notFound: "Событие не найдено или закрыто 😔"
      }
    };

    let curLang = localStorage.getItem('toyduman_lang') || 'kz';

    function setLang(l) {
      curLang = l;
      localStorage.setItem('toyduman_lang', l);
      document.getElementById('btn-kz').classList.toggle('active', l === 'kz');
      document.getElementById('btn-ru').classList.toggle('active', l === 'ru');

      const t = texts[l];
      document.getElementById('event-subtitle').innerText = t.subtitle;
      document.getElementById('lbl-upload').innerText = t.lblUpload;
      document.getElementById('lbl-name').innerText = t.lblName;
      document.getElementById('lbl-wish').innerText = t.lblWish;
      document.getElementById('btn-send').innerText = t.btnSend;
      document.getElementById('lbl-feed').innerText = t.feed;
      updateLimitUI();
    }

    async function initEvent() {
      if (!slug) {
        document.getElementById('event-title').innerText = texts[curLang].notFound;
        document.getElementById('form-card').style.display = 'none';
        return;
      }

      const { data, error } = await supabaseClient
        .from('events')
        .select('*')
        .eq('slug', slug)
        .single();

      if (error || !data) {
        document.getElementById('event-title').innerText = texts[curLang].notFound;
        document.getElementById('form-card').style.display = 'none';
        return;
      }

      currentEvent = data;
      document.getElementById('event-title').innerText = currentEvent.title;
      guestLimit = currentEvent.shot_limit || 25;

      const storedCount = localStorage.getItem(`shots_${slug}`);
      if (storedCount) uploadedCount = parseInt(storedCount);

      updateLimitUI();
      loadFeed();
    }

    function updateLimitUI() {
      const remain = Math.max(0, guestLimit - uploadedCount);
      const el = document.getElementById('shot-counter');
      if (guestLimit >= 999) {
        el.innerText = curLang === 'kz' ? "Шектеусіз кадр" : "Кадры без ограничений";
      } else {
        el.innerText = texts[curLang].remain + `${remain} / ${guestLimit}`;
      }

      if (remain <= 0 && guestLimit < 999) {
        document.getElementById('btn-send').disabled = true;
        document.getElementById('lbl-upload').innerText = texts[curLang].limitOver;
      }
    }

    function previewFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      selectedFile = file;
      const img = document.getElementById('preview');
      img.src = URL.createObjectURL(file);
      img.style.display = 'block';
    }

    async function uploadPhoto() {
      if (!selectedFile) {
        alert(texts[curLang].selectPhoto);
        return;
      }

      const btn = document.getElementById('btn-send');
      const msgBox = document.getElementById('msg-box');
      btn.disabled = true;
      btn.innerText = curLang === 'kz' ? "Жүктелуде... ⏳" : "Загрузка... ⏳";

      try {
        const fileExt = selectedFile.name.split('.').pop();
        const fileName = `${currentEvent.id}/${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;

        // Storage-ге салу
        const { data: uploadData, error: uploadErr } = await supabaseClient.storage
          .from('photos')
          .upload(fileName, selectedFile);

        if (uploadErr) throw uploadErr;

        const { data: urlData } = supabaseClient.storage
          .from('photos')
          .getPublicUrl(fileName);

        const publicUrl = urlData.publicUrl;
        const author = document.getElementById('guest-name').value.trim() || 'Қонақ';
        const wish = document.getElementById('guest-wish').value.trim();

        // Базаға тілекпен бірге жазу
        const { error: dbErr } = await supabaseClient
          .from('event_photos')
          .insert([{
            event_id: currentEvent.id,
            photo_url: publicUrl,
            author_name: author,
            wishes: wish
          }]);

        if (dbErr) throw dbErr;

        uploadedCount++;
        localStorage.setItem(`shots_${slug}`, uploadedCount);
        updateLimitUI();

        msgBox.className = 'msg success';
        msgBox.innerText = texts[curLang].success;
        msgBox.style.display = 'block';

        // Форманы тазарту
        document.getElementById('preview').style.display = 'none';
        document.getElementById('guest-wish').value = '';
        selectedFile = null;

        setTimeout(() => { msgBox.style.display = 'none'; }, 3000);
        loadFeed();

      } catch (err) {
        msgBox.className = 'msg error';
        msgBox.innerText = "Қате: " + err.message;
        msgBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerText = texts[curLang].btnSend;
      }
    }

    async function loadFeed() {
      if (!currentEvent) return;
      const { data, error } = await supabaseClient
        .from('event_photos')
        .select('*')
        .eq('event_id', currentEvent.id)
        .order('created_at', { ascending: false });

      if (error || !data) return;

      const feedBox = document.getElementById('feed-list');
      feedBox.innerHTML = '';

      data.forEach(item => {
        const div = document.createElement('div');
        div.className = 'feed-item';
        div.innerHTML = `
          <img src="${item.photo_url}" loading="lazy">
          <div class="feed-info">
            <div class="feed-author">👤 ${item.author_name}</div>
            ${item.wishes ? `<div class="feed-caption">💬 ${item.wishes}</div>` : ''}
          </div>
        `;
        feedBox.appendChild(div);
      });
    }

    setLang(curLang);
    initEvent();
  </script>
</body>
</html>
