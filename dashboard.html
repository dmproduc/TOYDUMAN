<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Басқару Панелі — ToyDuman</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --header-bg: rgba(255, 255, 255, 0.85);
      --pill-bg: #f1f5f9;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --modal-bg: #ffffff;
      --input-bg: #f8fafc;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.06);
    }

    [data-theme="dark"] {
      --bg: #0b0f17;
      --card-bg: #151d2a;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #263346;
      --header-bg: rgba(21, 29, 42, 0.85);
      --pill-bg: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --modal-bg: #151d2a;
      --input-bg: #0b0f17;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
      --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; transition: background-color 0.2s, color 0.2s, border-color 0.2s; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 90px; }

    header {
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 40;
      padding: 14px 20px;
    }
    .header-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .logo span { color: var(--accent); }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-toggle {
      background: var(--pill-bg);
      border: 1px solid var(--border);
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--pill-bg);
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-logout {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 700;
      padding-left: 6px;
    }

    .container {
      max-width: 900px;
      margin: 28px auto;
      padding: 0 20px;
    }

    .section-title-wrap {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 22px;
    }
    .section-title {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--text);
    }
    .section-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .event-card {
      background: var(--card-bg);
      border-radius: 18px;
      border: 1px solid var(--border);
      padding: 22px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .event-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }
    .badge-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .event-badge {
      background: rgba(37, 99, 235, 0.12);
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .photo-count-badge {
      background: var(--pill-bg);
      color: var(--text);
      border: 1px solid var(--border);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .event-card-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }
    .event-meta {
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 20px;
    }
    .event-meta b { color: var(--text); }

    .card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: auto;
    }
    .btn-action {
      text-align: center;
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }
    .btn-action-qr { background: var(--pill-bg); color: var(--text); border: 1px solid var(--border); }
    .btn-action-album { background: var(--accent); color: #fff; }
    .btn-action-album:hover { background: var(--accent-hover); }

    .empty-box {
      text-align: center;
      padding: 60px 20px;
      background: var(--card-bg);
      border-radius: 20px;
      border: 2px dashed var(--border);
    }

    .bottom-nav {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      box-shadow: 0 12px 32px rgba(0,0,0,0.15);
      border-radius: 40px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 24px;
      z-index: 50;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 20px;
    }
    .nav-item.active { color: var(--accent); }
    .nav-item svg { width: 22px; height: 22px; }

    .nav-add-btn {
      width: 54px;
      height: 54px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      border-radius: 50%;
      border: 3px solid var(--card-bg);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.35);
      cursor: pointer;
    }
    .nav-add-btn:active { transform: scale(0.92); }
    .nav-add-btn svg { width: 28px; height: 28px; }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-card {
      background: var(--modal-bg);
      width: 100%;
      max-width: 480px;
      border-radius: 24px;
      padding: 28px;
      border: 1px solid var(--border);
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: var(--pill-bg);
      border: 1px solid var(--border);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      color: var(--text);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }
    .form-group label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
    }
    .form-group input, .form-group select {
      background: var(--input-bg);
      border: 1px solid var(--border);
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: var(--accent);
    }

    .btn-create {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      width: 100%;
      cursor: pointer;
      margin-top: 8px;
    }

    .qr-modal-body {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .qr-box-wrap {
      background: #fff;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid var(--border);
      margin: 16px 0;
    }
    .link-copy-box {
      background: var(--input-bg);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.8rem;
      color: var(--text);
      word-break: break-all;
      border: 1px solid var(--border);
      width: 100%;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="logo">
        ✨ TOY<span>DUMAN</span>
      </div>
      <div class="header-right">
        <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()" title="Режимді ауыстыру">🌙</button>
        <div class="user-pill">
          <span id="user-email">Жүктелуде...</span>
          <button class="btn-logout" onclick="logout()">Шығу</button>
        </div>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="section-title-wrap">
      <div>
        <h1 class="section-title">Менің мерекелерім</h1>
        <p class="section-desc">Сіз ашқан іс-шаралар, фотоальбомдар мен QR-кодтар</p>
      </div>
    </div>

    <div class="events-grid" id="events-list"></div>

    <div class="empty-box" id="empty-state" style="display: none;">
      <div style="font-size: 3rem;">📁</div>
      <h3 style="color: var(--text);">Әзірге ешқандай іс-шара ашылмаған</h3>
      <p style="color: var(--text-muted); margin-top: 6px;">Төмендегі «+» батырмасын басып, алғашқы мерекеңізді құрыңыз!</p>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-item active" onclick="loadMyEvents()">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
      Іс-шаралар
    </button>

    <button class="nav-add-btn" onclick="openCreateModal()" title="Жаңа той құру">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
    </button>

    <button class="nav-item" onclick="openCreateModal()">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
      Жаңа QR
    </button>
  </div>

  <!-- Модаль 1: Жаңа іс-шара құру -->
  <div class="modal-overlay" id="create-modal">
    <div class="modal-card">
      <button class="modal-close" onclick="closeCreateModal()">✕</button>
      <h2 style="font-size: 1.3rem; font-weight: 800; margin-bottom: 6px; color: var(--text);">Жаңа іс-шара құру</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px;">Мереке атын және қонақтарға арналған сілтемені енгізіңіз</p>

      <div class="form-group">
        <label>Іс-шара түрі мен атауы:</label>
        <input type="text" id="event-title" placeholder="Мысалы: Бауыржан & Аружан">
      </div>

      <div class="form-group">
        <label>Қысқаша сі
