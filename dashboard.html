<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Той иесінің кабинеті — ToyDuman</title>
  
  <!-- Supabase және QR кітапханалары -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0c10; color: #c5c6c7; min-height: 100vh; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 20px; }
    
    .top-bar { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.4rem; font-weight: 800; color: #fff; letter-spacing: 1px; }
    .logo span { color: #66fcf1; }
    
    .right-menu { display: flex; align-items: center; gap: 10px; }
    .lang-btns { display: flex; gap: 6px; }
    .lang-btn { background: #1f2833; border: 1px solid #45a29e; color: #c5c6c7; padding: 4px 10px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
    .lang-btn.active { background: #66fcf1; color: #0b0c10; }
    .btn-logout { background: transparent; border: 1px solid #ff4d4d; color: #ff4d4d; padding: 4px 10px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; }

    .card { background: #1f2833; border-radius: 16px; padding: 24px; border: 1px solid #2f3e46; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    h2 { font-size: 1.2rem; color: #fff; margin-bottom: 16px; }

    .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    label { font-size: 0.85rem; color: #aaa; }
    input, select { background: #0b0c10; border: 1px solid #45a29e; border-radius: 10px; padding: 12px; color: #fff; font-size: 0.95rem; outline: none; }
    
    .btn { background: #66fcf1; color: #0b0c10; border: none; padding: 14px; border-radius: 10px; font-weight: 700; cursor: pointer; text-align: center; width: 100%; font-size: 1rem; margin-top: 6px; transition: 0.2s; }
    .btn:active { transform: scale(0.98); }

    .event-result { display: none; margin-top: 20px; border-top: 1px dashed #45a29e; padding-top: 20px; text-align: center; }
    .qr-box { background: #fff; padding: 16px; border-radius: 16px; display: inline-block; margin: 15px 0; }
    .link-box { background: #0b0c10; padding: 12px; border-radius: 8px; word-break: break-all; font-size: 0.85rem; color: #66fcf1; border: 1px solid #333; margin-top: 10px; }
    .btn-album { display: inline-block; margin-top: 12px; background: #45a29e; color: #fff; text-decoration: none; padding: 10px 20px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <div class="logo">TOY<span>DUMAN</span></div>
      <div class="right-menu">
        <div class="lang-btns">
          <button class="lang-btn active" id="btn-kz" onclick="setLang('kz')">KZ</button>
          <button class="lang-btn" id="btn-ru" onclick="setLang('ru')">RU</button>
        </div>
        <button class="btn-logout" onclick="logout()">Шығу</button>
      </div>
    </div>

    <div class="card">
      <h2 id="title-text">Жаңа той құру</h2>
      
      <div class="form-group">
        <label id="lbl-title">Той атауы (Жұптың есімі):</label>
        <input type="text" id="event-title" placeholder="Мысалы: Асқар & Әсел">
      </div>

      <div class="form-group">
        <label id="lbl-slug">Қысқаша код/сілтеме (латынша):</label>
        <input type="text" id="event-slug" placeholder="askar-asel">
      </div>

      <div class="form-group">
        <label id="lbl-date">Той өтетін күн:</label>
        <input type="date" id="event-date">
      </div>

      <div class="form-group">
        <label id="lbl-limit">Бір қонаққа кадр лимиті:</label>
        <select id="event-limit">
          <option value="15">15 кадр</option>
          <option value="25" selected>25 кадр</option>
          <option value="50">50 кадр</option>
          <option value="999">Шектеусіз</option>
        </select>
      </div>

      <button class="btn" id="btn-submit" onclick="createNewEvent()">🎉 Тойды іске қосу & QR жасау</button>

      <div class="event-result" id="event-result">
        <h3 id="res-title" style="color: #66fcf1;">Той сәтті іске қосылды!</h3>
        <p id="res-desc" style="font-size: 0.85rem; margin-top: 6px;">Бұл QR-кодты үстелдерге қою үшін басып шығарыңыз:</p>
        
        <div class="qr-box" id="qrcode"></div>
        
        <p style="font-size: 0.8rem; color: #aaa;" id="res-link-lbl">Қонақтарға арналған тікелей сілтеме:</p>
        <div class="link-box" id="event-url"></div>

        <div style="margin-top: 15px;">
          <a id="album-link" class="btn-album" href="#" target="_blank">🖼️ Фотоальбомды ашу (ZIP жүктеу)</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://heuqifmvwrzkvtcarrdt.supabase.co";
    const SUPABASE_KEY = "sb_publishable_cOyPl30aOSb6pdxCRfRNQA_Tn6dBaZg";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function checkUser() {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
          window.location.href = "auth.html";
          return null;
        }
        return session.user;
      } catch (e) {
        return null;
      }
    }
    checkUser();

    async function logout() {
      await supabaseClient.auth.signOut();
      window.location.href = "auth.html";
    }

    const texts = {
      kz: {
        title: "Жаңа той құру",
        lblTitle: "Той атауы (Жұптың есімі):",
        lblSlug: "Қысқаша код/сілтеме (латынша):",
        lblDate: "Той өтетін күн:",
        lblLimit: "Бір қонаққа кадр лимиті:",
        btn: "🎉 Тойды іске қосу & QR жасау",
        btnLoading: "Іске қосылуда... ⏳",
        resTitle: "Той сәтті іске қосылды!",
        resDesc: "Бұл QR-кодты үстелдерге қою үшін басып шығарыңыз:",
        resLink: "Қонақтарға арналған тікелей сілтеме:"
      },
      ru: {
        title: "Создать новое событие",
        lblTitle: "Название (Имена молодожёнов):",
        lblSlug: "Короткая ссылка (латиницей):",
        lblDate: "Дата свадьбы:",
        lblLimit: "Лимит кадров на одного гостя:",
        btn: "🎉 Запустить событие & Создать QR",
        btnLoading: "Создание... ⏳",
        resTitle: "Событие успешно создано!",
        resDesc: "Распечатайте этот QR-код для гостей на столы:",
        resLink: "Прямая ссылка для гостей:"
      }
    };

    let curLang = localStorage.getItem('toyduman_lang') || 'kz';

    function setLang(l) {
      curLang = l;
      localStorage.setItem('toyduman_lang', l);
      document.getElementById('btn-kz').classList.toggle('active', l === 'kz');
      document.getElementById('btn-ru').classList.toggle('active', l === 'ru');

      const t = texts[l];
      document.getElementById('title-text').innerText = t.title;
      document.getElementById('lbl-title').innerText = t.lblTitle;
      document.getElementById('lbl-slug').innerText = t.lblSlug;
      document.getElementById('lbl-date').innerText = t.lblDate;
      document.getElementById('lbl-limit').innerText = t.lblLimit;
      document.getElementById('btn-submit').innerText = t.btn;
      document.getElementById('res-title').innerText = t.resTitle;
      document.getElementById('res-desc').innerText = t.resDesc;
      document.getElementById('res-link-lbl').innerText = t.resLink;
    }
    setLang(curLang);

    async function createNewEvent() {
      const title = document.getElementById('event-title').value.trim();
      let slug = document.getElementById('event-slug').value.trim().toLowerCase();
      const date = document.getElementById('event-date').value;
      const limit = parseInt(document.getElementById('event-limit').value);
      const submitBtn = document.getElementById('btn-submit');

      if (!title || !slug) {
        alert(curLang === 'kz' ? "Той атауы мен қысқаша сілтемені толтырыңыз!" : "Заполните название и короткую ссылку!");
        return;
      }

      slug = slug.replace(/[^a-z0-9_-]/g, '-');

      submitBtn.disabled = true;
      submitBtn.innerText = texts[curLang].btnLoading;

      try {
        // Тікелей сол сәттегі сессияны анықтау
        const { data: { session } } = await supabaseClient.auth.getSession();
        const userId = session ? session.user.id : null;

        const { data, error } = await supabaseClient
          .from('events')
          .insert([{
            user_id: userId,
            title: title,
            slug: slug,
            event_date: date ? date : null,
            shot_limit: limit,
            default_lang: curLang
          }])
          .select();

        if (error) {
          if (error.code === '23505') {
            throw new Error(curLang === 'kz' ? "Бұл код/сілтеме бұрыннан бар! Басқа сілтеме жазыңыз." : "Этот код ссылки уже занят! Придумайте другой.");
          }
          throw error;
        }

        const currentHost = window.location.origin + window.location.pathname.replace('dashboard.html', '');
        const guestLink = `${currentHost}event.html?slug=${slug}`;
        const galleryLink = `${currentHost}gallery.html?slug=${slug}`;

        document.getElementById('qrcode').innerHTML = "";
        new QRCode(document.getElementById('qrcode'), {
          text: guestLink,
          width: 180,
          height: 180
        });

        document.getElementById('event-url').innerText = guestLink;
        document.getElementById('album-link').href = galleryLink;
        document.getElementById('event-result').style.display = 'block';

      } catch (err) {
        alert("Қате: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = texts[curLang].btn;
      }
    }
  </script>
</body>
</html>
