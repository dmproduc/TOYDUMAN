<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Той Альбомы — Басқару Панелі</title>

  <!-- Supabase v2.48.1 және ZIP кітапханалары -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0c10; color: #c5c6c7; min-height: 100vh; padding: 20px; }
    .container { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

    .top-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; border-bottom: 1px solid #1f2833; padding-bottom: 15px; }
    .title-box h1 { font-size: 1.6rem; color: #fff; }
    .title-box p { font-size: 0.85rem; color: #45a29e; margin-top: 4px; }

    .action-btns { display: flex; gap: 10px; }
    .btn { background: #66fcf1; color: #0b0c10; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 700; cursor: pointer; text-decoration: none; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 6px; }
    .btn:active { transform: scale(0.98); }
    .btn-back { background: #1f2833; color: #fff; border: 1px solid #45a29e; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; margin-top: 10px; }
    .photo-card { background: #1f2833; border: 1px solid #2f3e46; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s; }
    .photo-card:hover { transform: translateY(-4px); }
    .photo-card img { width: 100%; height: 220px; object-fit: cover; cursor: pointer; }
    .info { padding: 12px; display: flex; flex-direction: column; gap: 4px; flex-grow: 1; }
    .author { font-size: 0.85rem; font-weight: bold; color: #66fcf1; }
    .wish { font-size: 0.8rem; color: #ddd; word-break: break-word; }
    .time { font-size: 0.7rem; color: #777; margin-top: auto; padding-top: 6px; }

    .empty-state { text-align: center; padding: 60px 20px; color: #777; font-size: 1.1rem; }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-header">
      <div class="title-box">
        <h1 id="event-title">Жүктелуде...</h1>
        <p id="event-stats">Фотолар тексерілуде...</p>
      </div>
      <div class="action-btns">
        <a href="dashboard.html" class="btn btn-back">Кабинетке қайту</a>
        <button id="btn-zip" class="btn" onclick="downloadAllZip()">📦 Барлығын ZIP-пен жүктеу</button>
      </div>
    </div>

    <div class="grid" id="photos-grid"></div>
    <div class="empty-state" id="empty-state" style="display: none;">Әзірге фотолар жүктелмеген 📸</div>
  </div>

  <script>
    const SUPABASE_URL = "https://heuqifmvwrzkvtcarrdt.supabase.co";
    const SUPABASE_KEY = "sb_publishable_cOyPl30aOSb6pdxCRfRNQA_Tn6dBaZg";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const slug = urlParams.get('slug');

    let currentEvent = null;
    let photoList = [];

    async function loadGallery() {
      if (!slug) {
        document.getElementById('event-title').innerText = "Той коды көрсетілмеген";
        document.getElementById('event-stats').innerText = "Сілтемеде ?slug= жоқ";
        return;
      }

      // 1. Тойды базадан табу
      const { data: eventData, error: eventErr } = await supabaseClient
        .from('events')
        .select('*')
        .eq('slug', slug)
        .single();

      if (eventErr || !eventData) {
        document.getElementById('event-title').innerText = "Той табылмады";
        document.getElementById('event-stats').innerText = eventErr ? eventErr.message : "Код: " + slug;
        return;
      }

      currentEvent = eventData;
      document.getElementById('event-title').innerText = currentEvent.title + " — Галерея";

      // 2. Фотоларды алу
      const { data: photos, error: photoErr } = await supabaseClient
        .from('event_photos')
        .select('*')
        .eq('event_id', currentEvent.id)
        .order('created_at', { ascending: false });

      if (photoErr) {
        alert("Фотоларды жүктеу қатесі: " + photoErr.message);
        return;
      }

      photoList = photos || [];
      document.getElementById('event-stats').innerText = `Жалпы фото саны: ${photoList.length}`;

      const grid = document.getElementById('photos-grid');
      const emptyState = document.getElementById('empty-state');
      grid.innerHTML = '';

      if (photoList.length === 0) {
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';

      photoList.forEach(item => {
        const card = document.createElement('div');
        card.className = 'photo-card';
        const dateStr = new Date(item.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        
        card.innerHTML = `
          <a href="${item.photo_url}" target="_blank">
            <img src="${item.photo_url}" loading="lazy" alt="Той фотосы">
          </a>
          <div class="info">
            <div class="author">👤 ${item.author_name || 'Қонақ'}</div>
            ${item.wishes ? `<div class="wish">💬 ${item.wishes}</div>` : ''}
            <div class="time">🕒 ${dateStr}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function downloadAllZip() {
      if (photoList.length === 0) {
        alert("Жүктейтін фотолар жоқ!");
        return;
      }

      const btn = document.getElementById('btn-zip');
      btn.disabled = true;
      btn.innerText = "Архив дайындалуда... ⏳";

      try {
        const zip = new JSZip();
        const folder = zip.folder("toyduman_photos");

        for (let i = 0; i < photoList.length; i++) {
          const p = photoList[i];
          btn.innerText = `Жүктелуде: ${i + 1}/${photoList.length}...`;
          
          const response = await fetch(p.photo_url);
          const blob = await response.blob();
          
          const cleanAuthor = (p.author_name || 'qonaq').replace(/[^a-zA-Z0-9а-яА-ЯёЁ]/g, '_');
          folder.file(`${i + 1}_${cleanAuthor}.jpg`, blob);
        }

        btn.innerText = "Архив қысылуда... 📦";
        const content = await zip.generateAsync({ type: "blob" });
        saveAs(content, `${slug}_photos.zip`);

      } catch (err) {
        alert("ZIP жасау қатесі: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "📦 Барлығын ZIP-пен жүктеу";
      }
    }

    loadGallery();
  </script>
</body>
</html>
