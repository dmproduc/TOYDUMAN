<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ортақ фотоальбом — ToyDuman</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #fcfbf9;
      --card-bg: rgba(255, 255, 255, 0.9);
      --text: #121212;
      --text-muted: #6b7280;
      --border-subtle: rgba(0, 0, 0, 0.08);
      --glass-btn-bg: rgba(244, 242, 238, 0.85);
      --glass-btn-border: rgba(0, 0, 0, 0.1);
      --radius: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Onest', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 60px; }

    /* Мұқаба баннері */
    .hero-banner {
      width: 100%;
      height: 320px;
      position: relative;
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 24px 20px;
      color: #fff;
    }
    .hero-banner::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.1) 20%, rgba(0,0,0,0.85) 100%);
    }
    .hero-content { position: relative; z-index: 2; max-width: 900px; margin: 0 auto; width: 100%; text-align: center; }
    .hero-title { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 2.6rem; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 4px; }
    .hero-meta { font-size: 0.88rem; color: #e5e5e5; display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }

    .container { max-width: 900px; margin: 20px auto 0 auto; padding: 0 16px; }

    /* Басқару тақтасы */
    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .total-count { font-size: 0.88rem; font-weight: 600; color: var(--text-muted); }
    
    .btn-zip {
      background: #121212;
      color: #fff;
      border: none;
      padding: 11px 22px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      transition: transform 0.15s;
    }
    .btn-zip:active { transform: scale(0.96); }

    /* Галерея торшасы */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }
    @media (max-width: 600px) {
      .gallery-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .hero-title { font-size: 2rem; }
      .hero-banner { height: 260px; }
    }

    .photo-card {
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 16px rgba(0,0,0,0.02);
      position: relative;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: transform 0.2s;
    }
    .photo-card:active { transform: scale(0.98); }
    .photo-thumb { width: 100%; height: 220px; object-fit: cover; display: block; background: #eae8e4; }
    @media (max-width: 600px) { .photo-thumb { height: 160px; } }

    /* Өшіру түймесі (тек иесіне) */
    .btn-delete-photo {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.9rem;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
      backdrop-filter: blur(4px);
    }
    .btn-delete-photo:hover { background: #ef4444; }

    .photo-info { padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
    .photo-author { font-size: 0.78rem; font-weight: 700; color: var(--text); }
    .photo-wish { font-size: 0.75rem; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .audio-badge { font-size: 0.72rem; color: #b45309; font-weight: 700; display: flex; align-items: center; gap: 4px; margin-top: 2px; }

    /* Lightbox толық экрандық модаль */
    .lightbox {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.92); backdrop-filter: blur(12px); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .lightbox-content { max-width: 90%; max-height: 85vh; display: flex; flex-direction: column; align-items: center; position: relative; }
    .lightbox-img { max-width: 100%; max-height: 68vh; object-fit: contain; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .lightbox-caption { color: #fff; text-align: center; margin-top: 14px; }
    .lightbox-caption h4 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 1.5rem; }
    .lightbox-caption p { font-size: 0.88rem; color: #ccc; margin-top: 4px; }
    .lightbox-audio { margin-top: 10px; width: 260px; height: 32px; }
    .lightbox-close { position: absolute; top: -40px; right: 0; color: #fff; font-size: 2rem; background: none; border: none; cursor: pointer; }
  </style>
</head>
<body>

  <div class="hero-banner" id="hero-banner">
    <div class="hero-content">
      <h1 class="hero-title" id="event-title">Жүктелуде...</h1>
      <div class="hero-meta">
        <span id="event-date">📅 Күні есептелуде...</span>
        <span id="event-shots-stat">📷 0 кадр</span>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="action-bar">
      <div class="total-count" id="count-label">Естеліктер жинағы</div>
      <button class="btn-zip" id="btn-download-all" onclick="downloadAllZip()">
        📦 Барлық фотоны ZIP ретінде жүктеу
      </button>
    </div>

    <div class="gallery-grid" id="gallery-grid"></div>
  </div>

  <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
    <div class="lightbox-content" onclick="event.stopPropagation()">
      <button class="lightbox-close" onclick="closeLightbox()">✕</button>
      <img id="lb-img" class="lightbox-img" src="" alt="Full view">
      <div class="lightbox-caption">
        <h4 id="lb-author"></h4>
        <p id="lb-wish"></p>
        <audio id="lb-audio" class="lightbox-audio" controls style="display: none;"></audio>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://heuqifmvwrzkvtcarrdt.supabase.co";
    const SUPABASE_KEY = "sb_publishable_cOyPl30aOSb6pdxCRfRNQA_Tn6dBaZg";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const slug = new URLSearchParams(window.location.search).get('slug');

    let currentEvent = null;
    let photosList = [];
    let isOwner = false;

    function getLocalUser() {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.includes('-auth-token')) {
          try {
            const data = JSON.parse(localStorage.getItem(key));
            if (data && data.user) return data.user;
          } catch(e) {}
        }
      }
      return null;
    }

    async function loadGallery() {
      if (!slug) return;

      const localUser = getLocalUser();

      const { data: eventData } = await supabaseClient
        .from('events')
        .select('*')
        .eq('slug', slug)
        .maybeSingle();

      if (!eventData) {
        document.getElementById('event-title').innerText = "Той табылмады";
        return;
      }
      currentEvent = eventData;

      if (localUser && localUser.id === currentEvent.user_id) {
        isOwner = true;
      } else {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session && session.user && session.user.id === currentEvent.user_id) {
          isOwner = true;
        }
      }

      document.getElementById('event-title').innerText = currentEvent.title;
      const dateText = currentEvent.event_date ? new Date(currentEvent.event_date).toLocaleDateString('kk-KZ') : 'Күні белгіленбеген';
      document.getElementById('event-date').innerText = `📅 ${dateText}`;

      const defaultCover = 'https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1200&q=80';
      document.getElementById('hero-banner').style.backgroundImage = `url('${currentEvent.cover_url || defaultCover}')`;

      fetchPhotos();
    }

    async function fetchPhotos() {
      const { data: photos } = await supabaseClient
        .from('event_photos')
        .select('*')
        .eq('event_id', currentEvent.id)
        .order('created_at', { ascending: false });

      photosList = photos || [];
      document.getElementById('event-shots-stat').innerText = `📷 ${photosList.length} фото жиналды`;
      document.getElementById('count-label').innerText = `Барлығы: ${photosList.length} естелік`;

      renderGrid();
    }

    function renderGrid() {
      const grid = document.getElementById('gallery-grid');
      grid.innerHTML = '';

      if (photosList.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #888; padding: 60px 20px;">Әзірге қонақтар фото жүктемеген 📷</div>';
        return;
      }

      photosList.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'photo-card';
        card.innerHTML = `
          <button class="btn-delete-photo" style="${isOwner ? 'display:flex;' : ''}" onclick="deletePhoto(event, '${item.id}')" title="Өшіру">🗑️</button>
          <img class="photo-thumb" src="${item.photo_url}" loading="lazy" onclick="openLightbox(${index})">
          <div class="photo-info" onclick="openLightbox(${index})">
            <span class="photo-author">👤 ${item.author_name || 'Қонақ'}</span>
            ${item.wishes ? `<span class="photo-wish">💬 ${item.wishes}</span>` : ''}
            ${item.audio_url ? `<span class="audio-badge">🎙️ Аудио-тілек бар</span>` : ''}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function deletePhoto(e, photoId) {
      e.stopPropagation();
      if (!confirm("Бұл фотоны өшіргіңіз келетініне сенімдісіз бе?")) return;

      const { error } = await supabaseClient
        .from('event_photos')
        .delete()
        .eq('id', photoId);

      if (!error) {
        fetchPhotos();
      } else {
        alert("Қате: " + error.message);
      }
    }

    function openLightbox(index) {
      const item = photosList[index];
      if (!item) return;

      document.getElementById('lb-img').src = item.photo_url;
      document.getElementById('lb-author').innerText = item.author_name || 'Қонақ';
      document.getElementById('lb-wish').innerText = item.wishes ? `"${item.wishes}"` : '';

      const audioEl = document.getElementById('lb-audio');
      if (item.audio_url) {
        audioEl.src = item.audio_url;
        audioEl.style.display = 'block';
      } else {
        audioEl.src = '';
        audioEl.style.display = 'none';
      }

      document.getElementById('lightbox').style.display = 'flex';
    }

    function closeLightbox() {
      document.getElementById('lightbox').style.display = 'none';
      const audioEl = document.getElementById('lb-audio');
      audioEl.pause();
      audioEl.src = '';
    }

    async function downloadAllZip() {
      if (photosList.length === 0) { alert("Жүктейтін фото жоқ!"); return; }

      const btn = document.getElementById('btn-download-all');
      btn.disabled = true;
      btn.innerText = "Архив дайындалуда... ⏳";

      try {
        const zip = new JSZip();
        const folder = zip.folder(`${currentEvent.slug}_photos`);

        for (let i = 0; i < photosList.length; i++) {
          btn.innerText = `Жүктелуде (${i + 1}/${photosList.length})... ⏳`;
          const photo = photosList[i];
          const response = await fetch(photo.photo_url);
          const blob = await response.blob();
          const author = (photo.author_name || 'guest').replace(/[^a-zA-Z0-9а-яА-ЯөӨіІңҢғҒүҮұҰқҚһҺ]/g, '_');
          folder.file(`${i + 1}_${author}.jpg`, blob);
        }

        btn.innerText = "ZIP файл жинақталуда... 📦";
        const content = await zip.generateAsync({ type: "blob" });
        saveAs(content, `${currentEvent.slug}_toyduman.zip`);

        btn.innerText = "✅ Барлығы сәтті жүктелді!";
        setTimeout(() => {
          btn.disabled = false;
          btn.innerText = "📦 Барлық фотоны ZIP ретінде жүктеу";
        }, 3000);
      } catch (err) {
        alert("Жүктеу қатесі: " + err.message);
        btn.disabled = false;
        btn.innerText = "📦 Барлық фотоны ZIP ретінде жүктеу";
      }
    }

    loadGallery();
  </script>
</body>
</html>
