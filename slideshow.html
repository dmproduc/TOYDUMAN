<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Слайд-шоу — ToyDuman</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Onest', sans-serif; }
    
    body {
      background-color: #0d0d0d;
      color: #fff;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Артқы бұлдыр фон (Blur backdrop) */
    .bg-blur {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: blur(40px) brightness(0.35);
      transform: scale(1.1);
      transition: background-image 1.2s ease-in-out;
      z-index: 1;
    }

    /* Негізгі фото контейнері */
    .slide-wrapper {
      position: relative;
      z-index: 2;
      max-width: 90vw;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .slide-img {
      max-width: 85vw;
      max-height: 68vh;
      object-fit: contain;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
      border: 1px solid rgba(255,255,255,0.1);
      transition: opacity 0.8s ease-in-out;
    }

    /* Фото авторы мен тілегі */
    .slide-caption {
      margin-top: 18px;
      text-align: center;
      max-width: 700px;
      animation: fadeIn 1s;
    }
    .author-name {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }
    .wish-text {
      font-size: 1.1rem;
      color: #ddd;
      margin-top: 4px;
      font-style: italic;
    }

    /* Жоғарғы жақтағы той аты */
    .top-brand {
      position: absolute;
      top: 24px;
      left: 30px;
      z-index: 10;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.5rem;
      color: rgba(255,255,255,0.8);
      font-weight: 600;
    }

    .empty-state {
      position: relative;
      z-index: 2;
      text-align: center;
      color: #888;
      font-size: 1.2rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="top-brand" id="event-title">ToyDuman Live</div>
  <div class="bg-blur" id="bg-blur"></div>

  <div class="slide-wrapper" id="slide-box" style="display: none;">
    <img id="current-img" class="slide-img" src="" alt="Live Photo">
    <div class="slide-caption">
      <div class="author-name" id="author-name"></div>
      <div class="wish-text" id="wish-text"></div>
    </div>
  </div>

  <div class="empty-state" id="empty-state">
    Қонақтардың алғашқы кадрлары күтілуде... 📸
  </div>

  <script>
    const SUPABASE_URL = "https://heuqifmvwrzkvtcarrdt.supabase.co";
    const SUPABASE_KEY = "sb_publishable_cOyPl30aOSb6pdxCRfRNQA_Tn6dBaZg";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const slug = new URLSearchParams(window.location.search).get('slug');

    let currentEvent = null;
    let photos = [];
    let currentIndex = 0;

    async function initSlideshow() {
      if (!slug) return;

      const { data: eventData } = await supabaseClient
        .from('events')
        .select('*')
        .eq('slug', slug)
        .single();

      if (!eventData) return;
      currentEvent = eventData;
      document.getElementById('event-title').innerText = `${currentEvent.title} • Live`;

      await loadPhotos();
      startCarousel();

      // Жаңа фото түскенде автоматты түрде базадан әр 10 секунд сайын тексеру
      setInterval(loadPhotos, 10000);
    }

    async function loadPhotos() {
      const { data } = await supabaseClient
        .from('event_photos')
        .select('*')
        .eq('event_id', currentEvent.id)
        .order('created_at', { ascending: false });

      if (data && data.length > 0) {
        photos = data;
        document.getElementById('empty-state').style.display = 'none';
        document.getElementById('slide-box').style.display = 'flex';
      }
    }

    function showSlide(index) {
      if (photos.length === 0) return;
      const item = photos[index];

      const img = document.getElementById('current-img');
      img.style.opacity = '0';

      setTimeout(() => {
        img.src = item.photo_url;
        document.getElementById('bg-blur').style.backgroundImage = `url('${item.photo_url}')`;
        document.getElementById('author-name').innerText = item.author_name || 'Қонақ';
        document.getElementById('wish-text').innerText = item.wishes ? `"${item.wishes}"` : '';
        img.style.opacity = '1';
      }, 400);
    }

    function startCarousel() {
      if (photos.length > 0) showSlide(0);

      setInterval(() => {
        if (photos.length === 0) return;
        currentIndex = (currentIndex + 1) % photos.length;
        showSlide(currentIndex);
      }, 5000); // Әр 5 секунд сайын ауысады
    }

    initSlideshow();
  </script>
</body>
</html>
