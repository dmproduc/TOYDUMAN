<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Слайд-шоу — ToyDuman</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; width: 100vw; height: 100vh; overflow: hidden; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; align-items: center; justify-content: center; }

    .slide-wrapper {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .slide-wrapper.active { opacity: 1; }

    .slide-bg {
      position: absolute;
      width: 110%; height: 110%;
      object-fit: cover;
      filter: blur(25px) brightness(0.35);
      transform: scale(1.05);
    }

    .main-image {
      position: relative;
      max-width: 90vw;
      max-height: 82vh;
      border-radius: 20px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8);
      z-index: 10;
      animation: gentleZoom 6s infinite alternate ease-in-out;
    }
    @keyframes gentleZoom {
      from { transform: scale(1); }
      to { transform: scale(1.03); }
    }

    .caption-card {
      position: absolute;
      bottom: 40px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      padding: 16px 30px;
      border-radius: 40px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 15px;
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .caption-author { font-size: 1.15rem; font-weight: 800; color: #60a5fa; }
    .caption-wish { font-size: 1.15rem; color: #fff; font-family: 'Playfair Display', serif; font-style: italic; }

    .waiting-screen { text-align: center; font-size: 1.8rem; color: #64748b; font-weight: 700; z-index: 5; }
  </style>
</head>
<body>

  <div class="waiting-screen" id="waiting">✨ Суреттер жүктелуін күтуде... ✨</div>

  <div class="slide-wrapper" id="slide1">
    <img class="slide-bg" id="bg1">
    <img class="main-image" id="img1">
    <div class="caption-card" id="card1">
      <span class="caption-author" id="author1"></span>
      <span class="caption-wish" id="wish1"></span>
    </div>
  </div>

  <div class="slide-wrapper" id="slide2">
    <img class="slide-bg" id="bg2">
    <img class="main-image" id="img2">
    <div class="caption-card" id="card2">
      <span class="caption-author" id="author2"></span>
      <span class="caption-wish" id="wish2"></span>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://heuqifmvwrzkvtcarrdt.supabase.co";
    const SUPABASE_KEY = "sb_publishable_cOyPl30aOSb6pdxCRfRNQA_Tn6dBaZg";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const slug = new URLSearchParams(window.location.search).get('slug');

    let photos = [];
    let currentIndex = 0;
    let activeSlot = 1;

    async function fetchPhotos() {
      if (!slug) return;
      const { data: eventData } = await supabaseClient.from('events').select('id').eq('slug', slug).single();
      if (!eventData) return;

      const { data } = await supabaseClient
        .from('event_photos')
        .select('*')
        .eq('event_id', eventData.id)
        .order('created_at', { ascending: false });

      if (data && data.length > 0) {
        photos = data;
        document.getElementById('waiting').style.display = 'none';
      }
    }

    function showNextSlide() {
      if (photos.length === 0) return;

      const photo = photos[currentIndex];
      const targetSlot = activeSlot === 1 ? 2 : 1;
      const currentSlide = document.getElementById(`slide${activeSlot}`);
      const nextSlide = document.getElementById(`slide${targetSlot}`);

      document.getElementById(`bg${targetSlot}`).src = photo.photo_url;
      document.getElementById(`img${targetSlot}`).src = photo.photo_url;
      document.getElementById(`author${targetSlot}`).innerText = "👤 " + (photo.author_name || 'Қонақ');
      document.getElementById(`wish${targetSlot}`).innerText = photo.wishes ? `«${photo.wishes}»` : '';

      nextSlide.classList.add('active');
      currentSlide.classList.remove('active');

      activeSlot = targetSlot;
      currentIndex = (currentIndex + 1) % photos.length;
    }

    async function init() {
      await fetchPhotos();
      if (photos.length > 0) showNextSlide();

      // Әр 5 секунд сайын сурет ауысып отырады
      setInterval(showNextSlide, 5000);

      // Әр 15 секунд сайын жаңа түскен суреттерді базадан автоматты түрде қосып отырады
      setInterval(fetchPhotos, 15000);
    }

    init();
  </script>
</body>
</html>
