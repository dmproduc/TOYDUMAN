<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Слайд-шоу — ToyDuman</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Onest', sans-serif; }
    
    body {
      background-color: #0b0b0b;
      color: #ffffff;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Артқы бұлдыр кинематографиялық фон */
    .bg-blur {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: blur(50px) brightness(0.3);
      transform: scale(1.15);
      transition: background-image 1.2s ease-in-out;
      z-index: 1;
    }

    /* Слайд контенті */
    .slide-wrapper {
      position: relative;
      z-index: 2;
      max-width: 90vw;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .slide-img {
      max-width: 85vw;
      max-height: 70vh;
      object-fit: contain;
      border-radius: 18px;
      box-shadow: 0 24px 70px rgba(0,0,0,0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: opacity 0.7s ease-in-out;
      opacity: 0;
    }

    .slide-caption {
      margin-top: 18px;
      text-align: center;
      max-width: 760px;
      padding: 0 16px;
    }
    .author-name {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.7);
    }
    .wish-text {
      font-size: 1.15rem;
      color: #e5e5e5;
      margin-top: 6px;
      font-style: italic;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      line-height: 1.4;
    }

    /* Жоғарғы бұрыштағы той атауы мен Live белгісі */
    .top-header {
      position: absolute;
      top: 24px;
      left: 32px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .event-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.6rem;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }
    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(220, 38, 38, 0.25);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .live-dot {
      width: 7px;
      height: 7px;
      background: #ef4444;
      border-radius: 50%;
      animation: blink 1.2s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .empty-state {
      position: relative;
      z-index: 2;
      text-align: center;
      color: #999;
      font-size: 1.3rem;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div class="top-header">
    <div class="event-title" id="event-title">ToyDuman</div>
    <div class="live-indicator"><span class="live-dot"></span> Live</div>
  </div>

  <div class="bg-blur" id="bg-blur"></div>

  <div class="slide-wrapper" id="slide-box" style="display: none;">
    <img id="current-img" class="slide-img" src="" alt="Live Photo">
    <div class="slide-caption">
      <div class="author-name" id="author-name"></div>
      <div class="wish-text" id="wish-text"></div>
    </div>
  </div>

  <div class="empty-state" id="empty-state">
    Қонақтардың алғашқы кадрлары күтілуде... 📸
  </div>

  <script>
    const SUPABASE_URL = "https://heuqifmvwrzkvtcarrdt.supabase.co";
    const SUPABASE_KEY = "sb_publishable_cOyPl30aOSb6pdxCRfRNQA_Tn6dBaZg";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const slug = new URLSearchParams(window.location.search).get('slug');

    let currentEvent = null;
    let photos = [];
    let currentIndex = 0;
    let carouselTimer = null;

    async function initSlideshow() {
      if (!slug) {
        document.getElementById('empty-state').innerText = "Той сілтемесі қате";
        return;
      }

      const { data: eventData, error } = await supabaseClient
        .from('events')
        .select('*')
        .eq('slug', slug)
        .maybeSingle();

      if (error || !eventData) {
        document.getElementById('empty-state').innerText = "Той табылмады";
        return;
      }

      currentEvent = eventData;
      document.getElementById('event-title').innerText = currentEvent.title;

      await loadPhotos();
      startCarousel();

      // Әр 10 секунд сайын базадан жаңа түскен суреттерді тексеру
      setInterval(loadPhotos, 10000);
    }

    async function loadPhotos() {
      if (!currentEvent) return;

      const { data } = await supabaseClient
        .from('event_photos')
        .select('*')
        .eq('event_id', currentEvent.id)
        .order('created_at', { ascending: false });

      if (data && data.length > 0) {
        const isFirstLoad = (photos.length === 0);
        photos = data;
        document.getElementById('empty-state').style.display = 'none';
        document.getElementById('slide-box').style.display = 'flex';

        if (isFirstLoad) {
          showSlide(0);
        }
      }
    }

    function showSlide(index) {
      if (photos.length === 0) return;
      const item = photos[index];

      const img = document.getElementById('current-img');
      img.style.opacity = '0';

      setTimeout(() => {
        img.src = item.photo_url;
        document.getElementById('bg-blur').style.backgroundImage = `url('${item.photo_url}')`;
        document.getElementById('author-name').innerText = item.author_name || 'Қонақ';
        document.getElementById('wish-text').innerText = item.wishes ? `"${item.wishes}"` : '';
        
        img.onload = () => {
          img.style.opacity = '1';
        };

        // Келесі фотоны алдын ала кэшке жүктеп қою (Preload)
        const nextIdx = (index + 1) % photos.length;
        if (photos[nextIdx]) {
          const preImg = new Image();
          preImg.src = photos[nextIdx].photo_url;
        }
      }, 400);
    }

    function startCarousel() {
      if (carouselTimer) clearInterval(carouselTimer);

      carouselTimer = setInterval(() => {
        if (photos.length === 0) return;
        currentIndex = (currentIndex + 1) % photos.length;
        showSlide(currentIndex);
      }, 5500); // Әр 5.5 секунд сайын ауысады
    }

    initSlideshow();
  </script>
</body>
</html>
